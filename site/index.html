<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Logs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Logs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical box-score desk, numbers first, no odds, no hype.
   IDEA: a printed scouting card — team-colour masthead with the matchup ticket, over agate game logs.
   PICTURE: the masthead matchup (team marks facing off) and the game-by-game bar strip.
   COLOUR and TYPE: white sheet / night court; the player's team colour leads, ink support, court orange as the one accent; Barlow Condensed figures + Barlow text.
   LAYOUT: search bar, slim masthead with averages, then two columns: stats + matchup on the left, matchup ticket, injuries and news in a sticky right rail. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1115);--ink:light-dark(#14161a,#eceef2);--mut:light-dark(#646a73,#9aa1ab);--line:light-dark(#e3e5e9,#262a31);--soft:light-dark(#f4f5f7,#171a20);--card:light-dark(#fff,#14171d);--acc:#f26b1d;--good:light-dark(#1a7f37,#4ac26b);--warn:light-dark(#b26a00,#f0b429);--bad:light-dark(#c62828,#ff6b6b);--tc:#1d428a;--oc:#555;--tcb:light-dark(var(--tc),color-mix(in oklab,var(--tc) 50%,white));--tink:#fff;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(18px,3vw,36px) max(5vw,16px)}
.wrap{max-width:1440px;margin:0 auto}
h1,h2,h3,.big,.chip,.num{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif}
svg{font-family:Barlow,system-ui,sans-serif}
a{color:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:12px}
.top .wrap{max-width:1440px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lg{position:relative;display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:999px;border:1px solid var(--line)}
.lg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:999px;background:var(--ink);box-shadow:0 2px 8px rgb(0 0 0/.18);transition:left .35s var(--ease),width .35s var(--ease)}
.lg .chip{position:relative;z-index:1;min-height:40px;padding:0 16px;font-size:18px;border:0;background:transparent;transition:color .3s}
.lg .chip[aria-pressed=true]{background:transparent;color:var(--bg)}
.srch{position:relative;flex:1 1 180px;max-width:560px}
.srch input{width:100%;font:16px Barlow,sans-serif;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);min-height:46px;transition:border-color .2s,box-shadow .2s}
.srch svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--mut)}
.srch input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in oklab,var(--acc) 20%,transparent)}
.dd{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgb(0 0 0/.2);max-height:380px;overflow:auto;opacity:0;translate:0 -6px;pointer-events:none;transition:opacity .16s,translate .16s var(--ease)}
.dd.on{opacity:1;translate:0 0;pointer-events:auto}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;min-height:48px;border:0;background:none;color:var(--ink);font:15px Barlow,sans-serif;cursor:pointer}
.dd button:hover,.dd button.hl{background:var(--soft)}
.dd .nm{flex:1}.dd small{color:var(--mut)}
.dd img{width:26px;height:26px;object-fit:contain}
.thru{color:var(--mut);font-size:13px}
/* masthead */
.mast{position:relative;overflow:hidden;color:var(--tink);background:linear-gradient(120deg,var(--tc) 0%,color-mix(in oklab,var(--tc) 72%,black) 62%,color-mix(in oklab,var(--oc) 55%,black) 100%);transition:background .5s}
.mast .wm{position:absolute;right:-60px;top:50%;translate:0 -50%;width:min(520px,70vw);opacity:.1;pointer-events:none;filter:grayscale(.2)}
.mast{padding-block:clamp(16px,2.4vw,28px)}
.mast .wrap{position:relative;max-width:1440px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:16px 28px;align-items:center}
.who{display:flex;gap:18px;align-items:center}
.mono{flex:none;width:clamp(76px,10vw,104px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.12);border:3px solid rgb(255 255 255/.55);box-shadow:inset 0 -10px 24px rgb(0 0 0/.2);font:800 clamp(32px,4.5vw,46px)/1 "Barlow Condensed",sans-serif;letter-spacing:-.01em}
h1{font-size:clamp(32px,4.4vw,48px);line-height:1.02;margin:0;font-weight:700;text-wrap:balance}
.meta{opacity:.85;margin-top:4px}
.stat-pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px;background:#fff;color:#111}
.stat-pill i{width:8px;height:8px;border-radius:50%;background:var(--sc,#999)}
.ticket{color:var(--tink);background:linear-gradient(135deg,var(--tc),color-mix(in oklab,var(--tc) 55%,black) 60%,color-mix(in oklab,var(--oc) 70%,black));border-radius:16px;padding:16px 18px;box-shadow:0 10px 28px rgb(0 0 0/.18)}
.face a{color:inherit;text-decoration:none}.when a{color:inherit;font-weight:700}
.face{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.face img{width:clamp(54px,7vw,76px);height:clamp(54px,7vw,76px);object-fit:contain;filter:drop-shadow(0 6px 10px rgb(0 0 0/.3))}
.face .lbl{font:700 18px "Barlow Condensed",sans-serif;margin-top:2px}
.face .vsx{font:800 22px "Barlow Condensed",sans-serif;opacity:.75}
.logo-fb{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgb(255 255 255/.15);font:800 22px "Barlow Condensed",sans-serif}
.when{text-align:center;margin-top:8px;font-weight:500}
.ctx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.ctx span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgb(255 255 255/.16)}
.ctx span.hot{background:#fff;color:#111}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{background:rgb(255 255 255/.1);border-radius:10px;padding:8px 10px}
.tile .big{font-size:30px;line-height:1;font-weight:700}
.tile small{display:block;opacity:.8;font-size:13px}
/* two-column layout */
.layout{max-width:1440px;margin:0 auto;padding:clamp(16px,2.4vw,28px) max(4vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:24px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:24px}
.col-side{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.2vw,26px)}
.match{background:var(--soft)}
.match .head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.match .head h2{display:flex;align-items:center;gap:10px}
.match .head h2 img{width:40px;height:40px;object-fit:contain}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 8px}
.card h3{display:flex;align-items:center;gap:8px;font-size:20px;margin:0 0 6px}
.card h3 img{width:24px;height:24px;object-fit:contain}
.card h3 small{margin-left:auto;font:500 13px Barlow,sans-serif;color:var(--mut)}
.inj{list-style:none;margin:0;padding:0}
.inj li{border-top:1px solid var(--line)}
.inj details{padding:8px 0}
.inj summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none}
.inj summary::-webkit-details-marker{display:none}
.inj .n{font-weight:600}.inj .p{color:var(--mut);font-size:13px}
.inj .s{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--sc)}
.inj .w{display:block;color:var(--mut);font-size:13px}
.inj .c{font-size:14px;margin:6px 0 2px;color:var(--ink)}
.inj .flag{font-size:11px;font-weight:700;color:var(--acc);margin-left:4px}
.inj li.me{background:color-mix(in oklab,var(--acc) 10%,transparent);border-radius:8px;padding-inline:6px}
.more{border:0;background:none;color:var(--acc);font:600 14px Barlow,sans-serif;padding:8px 0;cursor:pointer;min-height:40px}
.news{list-style:none;margin:0;padding:0}
.news li{border-top:1px solid var(--line);padding:9px 0}
.news a{font-weight:600;text-decoration:none;line-height:1.3;display:block}
.news a:hover{text-decoration:underline;text-decoration-color:var(--acc)}
.news small{color:var(--mut);font-size:13px}
.news .tg{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--soft);border:1px solid var(--line);margin-right:6px;color:var(--ink)}
.news .tg.me{background:var(--acc);border-color:var(--acc);color:#fff}
.quiet{color:var(--mut);font-size:14px;padding:6px 0 10px;margin:0}
/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp>span{font-size:13px;color:var(--mut);margin-right:4px}
.chip{font-size:15px;font-weight:600;flex:none;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;cursor:pointer;transition:background .18s,color .18s,border-color .18s,scale .12s}
.chip:hover{border-color:var(--mut)}
.chip:active{scale:.95}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.more:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mark input,select{font:16px Barlow,sans-serif;min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.mark input{width:90px}
h2{font-size:32px;line-height:1.05;margin:0 0 4px;font-weight:700}
h3{font-size:24px;line-height:1.1;margin:0;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px}
.sum{display:flex;flex-wrap:wrap;gap:8px 22px;margin:4px 0 10px;align-items:baseline}
.sum .big{font-size:42px;font-weight:700;line-height:1}
.sum .hit{color:var(--acc);font-weight:600}
.fig{position:relative;min-height:300px;border-bottom:1px solid var(--line)}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{transform-box:fill-box;transform-origin:bottom;transition:opacity .2s}
.fig svg g:hover .bar{opacity:.78}
.avgs{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.avgs div{flex:1 1 84px;background:var(--card);padding:9px 11px}
.avgs .big{font-size:25px;font-weight:600;line-height:1.1;display:block}
.avgs small{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mut);font-size:13px;background:var(--bg)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--soft)}
td.hl{font-weight:700}
tr.dnp td{color:var(--mut)}
.tag{font-size:11px;font-weight:600;color:var(--acc);margin-left:4px}
.W{color:var(--good)}.L{color:var(--bad)}
/* polish */
[hidden]{display:none!important}
::selection{background:color-mix(in oklab,var(--acc) 30%,transparent)}
.crumb{max-width:1440px;margin:0 auto;padding:10px max(4vw,16px) 0;font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--ink);font-weight:600;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);transition:background .2s}
.crumb a:hover{background:var(--line)}
.rv{opacity:0;translate:0 16px;transition:opacity .55s var(--ease),translate .55s var(--ease)}
.rv.on{opacity:1;translate:0 0}
.gcard.rv{transition-delay:calc(var(--i,0)*35ms)}
.hero{position:relative;overflow:hidden}
.hero .art{position:absolute;right:-20px;top:50%;translate:0 -50%;height:130%;width:auto;opacity:.2;pointer-events:none}
.hero .art *{fill:none;stroke:#fff;stroke-width:3}
.hero .art text{fill:#fff;stroke:none;font:700 26px "Barlow Condensed",sans-serif}
.hero .wrap{position:relative}
.hstrip{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hstrip>*{display:flex;flex-direction:column;justify-content:center;min-width:130px;padding:10px 14px;border-radius:12px;background:rgb(255 255 255/.12);border:1px solid rgb(255 255 255/.18);color:inherit;text-decoration:none;transition:background .2s,translate .2s var(--ease)}
.hstrip a:hover{background:rgb(255 255 255/.2);translate:0 -2px}
.hstrip b{font:800 28px/1 "Barlow Condensed",sans-serif}.hstrip small{opacity:.8;font-size:13px}
.gcard{position:relative;overflow:hidden;padding-left:18px}
.gcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--ac,#888) 50%,var(--hc,#888) 50%)}
.gcard .gt img{transition:scale .25s var(--ease)}.gcard:hover .gt img{scale:1.12}
.gtime{display:flex;justify-content:space-between;gap:8px}.gtime .cd{color:var(--acc);font-weight:700}
.em{display:block;width:96px;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.em i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,color-mix(in oklab,var(--good) 55%,transparent),var(--good));transform-origin:left}
.rrow,.fav{position:relative}
.rrow::before,.fav::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--tcb);opacity:0;transition:opacity .2s}
.rrow:hover::before,.fav:hover::before{opacity:1}
.tape{display:flex;flex-direction:column;gap:2px}
.tape-h{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);align-items:center;gap:10px;margin-bottom:6px;font:700 20px "Barlow Condensed",sans-serif}
.tape-h span:first-child{text-align:right}.tape-h .logo-fb{width:28px;height:28px;font-size:11px;margin:0 6px;vertical-align:middle}.tape-h .tvs{text-align:center;color:var(--mut);font-size:16px}.tape-h img{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin:0 6px}
.tape-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 150px 64px minmax(0,1fr);align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.tv{font:600 19px "Barlow Condensed",sans-serif;color:var(--mut);font-variant-numeric:tabular-nums}.tv.l{text-align:right}.tv.r{text-align:left}.tv.win{color:var(--ink);font-weight:800}
.tl{text-align:center;font-size:13px;color:var(--mut);font-weight:600}
.tctx{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);cursor:help}.tctx.l{justify-content:flex-end}
.trk{font:700 15px "Barlow Condensed",sans-serif;padding:1px 8px;border-radius:999px;min-width:44px;text-align:center}
.trk.good{background:color-mix(in oklab,var(--good) 16%,transparent);color:var(--good)}.trk.bad{background:color-mix(in oklab,var(--bad) 14%,transparent);color:var(--bad)}.trk.mut{background:var(--soft);color:var(--mut)}
.tdv{white-space:nowrap;font-variant-numeric:tabular-nums}
.tm{flex:1;max-width:160px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}.tctx.l .tm{justify-content:flex-end}
.tm i{display:block;height:100%;border-radius:3px;background:var(--mut);transform-origin:left}.tctx.l .tm i{transform-origin:right}.tm.none{background:none}.tm.good i{background:var(--good)}.tm.bad i{background:var(--bad)}
.tb{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}.tb.l{justify-content:flex-end}
.tb i{display:block;height:100%;border-radius:5px;background:var(--ac);opacity:.45;transition:opacity .2s}.tb.r i{background:var(--hc)}.tb i.win{opacity:1}
@media(max-width:640px){.tape-row{grid-template-columns:minmax(0,1fr) 44px 92px 44px minmax(0,1fr);gap:6px}.tm,.tdv,.hm{display:none}.tape-h{grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr)}.tl{font-size:12px}.hero .art{opacity:.12}}
.sk2{border-radius:14px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s linear infinite}
@media(prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  .viewin{animation:vin .45s var(--ease) both}@keyframes vin{from{opacity:0;translate:0 10px}}
  .hero,.mast{background-size:180% 180%;animation:drift 18s ease-in-out infinite alternate}@keyframes drift{from{background-position:0% 50%}to{background-position:100% 50%}}
  .hero .art .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s var(--ease) forwards;animation-delay:calc(var(--d,0)*90ms)}@keyframes draw{to{stroke-dashoffset:0}}
  .hero .art text{animation:fade 1s .8s both}
  .em i,.tb i,.tm i{animation:wipe .9s var(--ease) both}.tb.l i{transform-origin:right}
}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;translate:none}}
/* picks */
.dlg{position:fixed;inset:0;z-index:300;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;animation:fade .2s both}
.dlgc{width:min(420px,100%);background:var(--card);color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 30px 80px rgb(0 0 0/.35);display:flex;flex-direction:column;gap:12px;animation:up .3s var(--ease) both}
.dlgc h3{font-size:24px;margin:0}.dlgc .sub{margin:0}
.dlgc label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}.dlgc label small{font-weight:400;color:var(--mut)}
.dlgc input[type=number]{font:16px Barlow,sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg label{flex-direction:row;justify-content:center}.seg input{position:absolute;opacity:0}.seg span{display:block;width:100%;text-align:center;padding:10px;border-radius:9px;cursor:pointer;font-weight:700}
.seg input:checked+span{background:var(--ink);color:var(--bg)}.seg input:focus-visible+span{outline:2px solid var(--acc)}
.dlgb{display:flex;justify-content:flex-end;gap:8px}.chip.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.sm{min-height:32px;font-size:14px;padding:0 10px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 20px;opacity:0;z-index:250;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 12px 30px rgb(0 0 0/.25);transition:opacity .25s,translate .25s var(--ease);pointer-events:none}
.toast.on{opacity:1;translate:-50% 0;pointer-events:auto}.toast a{color:inherit}
.pkt td:nth-child(2),.pkt th:nth-child(2),.pkt td:nth-child(3),.pkt th:nth-child(3){text-align:left}.pkt .up{color:var(--good);font-weight:700}.pkt .dn{color:var(--bad);font-weight:700}
@keyframes up{from{opacity:0;translate:0 14px}}@keyframes fade{from{opacity:0}}
/* compare + partners */
.cmpg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cmpc{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tcb);border-radius:16px;padding:16px}
.cmpc img,.cmpc .logo-fb{width:56px;height:56px;object-fit:contain}.cmpc h2{margin:0}.cmpc h2 a{text-decoration:none}.cmpc .sub{margin:2px 0}.cmpc em{font-style:normal;font-weight:700}
.cmpt{table-layout:fixed}.cmpt td{text-align:center;font:600 20px "Barlow Condensed",sans-serif;color:var(--mut)}.cmpt td.win{color:var(--ink);font-weight:800}

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const f1=v=>Number.isFinite(v)?(Math.round(v*10)/10).toFixed(1):'–';
const fv=v=>Number.isInteger(v)?String(v):(Math.round(v*10)/10).toFixed(1);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const median=a=>{if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),h=(b.length-1)/2;return (b[Math.floor(h)]+b[Math.ceil(h)])/2};
const pct=(m,a)=>a?(Math.round(m/a*1000)/10)+'%':'–';
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const lum=h=>{const n=parseInt(h,16),f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,'').replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/\s+/g,' ').trim();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ago=iso=>{const m=(Date.now()-Date.parse(iso))/6e4;if(!Number.isFinite(m))return '';if(m<60)return Math.max(1,Math.round(m))+'m ago';if(m<1440)return Math.round(m/60)+'h ago';const d=Math.round(m/1440);return d===1?'yesterday':d+'d ago'};
const etDate=iso=>new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const dayDiff=(a,b)=>Math.round((Date.parse(b+'T12:00Z')-Date.parse(a+'T12:00Z'))/864e5);

let D=null,C={},P=null,L='nba',N=null;const cache={};
const v=(r,k)=>r[C[k]];
const isDNP=r=>r.length<=7;
const played=rows=>rows.filter(r=>!isDNP(r));

// ---------------- league definitions
const NBA={
  name:'NBA',file:'nba.json',hours:3,ranges:[['5','L5'],['10','L10'],['15','L15'],['20','L20']],defRange:'10',defPlayer:'Shai Gilgeous-Alexander',
  seasonLbl:s=>`${s-1}-${String(s).slice(2)}`,
  thru:d=>{const[y,m,dd]=d.through.split('-');return `Box scores through ${MON[+m-1]} ${+dd}, ${y}`},
  posName:{G:'guards',F:'forwards',C:'centers'},
  dvpLbl:{PTS:'points',REB:'rebounds',AST:'assists','3PM':'threes',PRA:'points + rebounds + assists'},
  meta:p=>[p.p==='G'?'Guard':p.p==='F'?'Forward':p.p==='C'?'Center':p.p,p.j?'#'+p.j:''],
  mono:p=>p.j?'#'+p.j:p.p,
  bucket:pos=>({PG:'G',SG:'G',G:'G',SF:'F',PF:'F',F:'F',C:'C'})[pos]||null,
  pos:()=>({
    stats:[['PTS','Points',r=>v(r,'PTS')],['REB','Rebounds',r=>v(r,'REB')],['AST','Assists',r=>v(r,'AST')],['3PM','Threes made',r=>v(r,'3PM')],
      ['PRA','Pts + Reb + Ast',r=>v(r,'PTS')+v(r,'REB')+v(r,'AST')],['P+R','Pts + Reb',r=>v(r,'PTS')+v(r,'REB')],['P+A','Pts + Ast',r=>v(r,'PTS')+v(r,'AST')],['R+A','Reb + Ast',r=>v(r,'REB')+v(r,'AST')],
      ['STL','Steals',r=>v(r,'STL')],['BLK','Blocks',r=>v(r,'BLK')],['STL+BLK','Steals + Blocks',r=>v(r,'STL')+v(r,'BLK')],['TO','Turnovers',r=>v(r,'TO')],
      ['MIN','Minutes',r=>v(r,'MIN')],['FGA','Field goal attempts',r=>v(r,'FGA')],['3PA','Three attempts',r=>v(r,'3PA')],['FTA','Free throw attempts',r=>v(r,'FTA')]],
    tiles:['PTS','REB','AST','3PM','MIN'],
    table:[['MIN'],['PTS'],['REB'],['AST'],['3PM'],['STL'],['BLK'],['TO'],['FG',r=>v(r,'FGM')+'-'+v(r,'FGA')],['3P',r=>v(r,'3PM')+'-'+v(r,'3PA')],['FT',r=>v(r,'FTM')+'-'+v(r,'FTA')],['+/-',r=>(v(r,'PM')>0?'+':'')+v(r,'PM')]],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['MIN',m('MIN')],['PTS',m('PTS')],['REB',m('REB')],['AST',m('AST')],['3PM',m('3PM')],['STL',m('STL')],['BLK',m('BLK')],['TO',m('TO')],
        ['PRA',f1(mean(pr.map(r=>v(r,'PTS')+v(r,'REB')+v(r,'AST'))))],['FG%',pct(s('FGM'),s('FGA'))],['3P%',pct(s('3PM'),s('3PA'))],['FT%',pct(s('FTM'),s('FTA'))]]}
  }),
  dateLbl:(g,yr)=>{const[y,m,d]=g[0].split('-');return `${MON[+m-1]} ${+d}`+(yr?` '${y.slice(2)}`:'')},
  tag:g=>g[2]===3?'PO':g[2]===5?'PI':'',
  rest:(days)=>days<=0?['Back-to-back',true]:days===1?['1 day rest',false]:[`${days} days rest`,false],
  logo:a=>`https://a.espncdn.com/i/teamlogos/nba/500/${a.toLowerCase()}.png`,
  projN:10,restKeys:['b2b','r1','r2'],restLbl:{b2b:'Back-to-back',r1:'1 day rest',r2:'2+ days rest'},restB:d=>d==null||d<0?null:d===0?'b2b':d===1?'r1':'r2',
  // which injured players matter for this player
  oppFlag:(ip,P)=>NBA.bucket(ip)&&NBA.bucket(ip)===P.b?'same position':'',
  ownFlag:(ip,P)=>NBA.bucket(ip)&&NBA.bucket(ip)===P.b?'same position':''

const T=(title,...ls)=>[title,...ls.filter(x=>x!=null&&x!==false&&x!=='').map(l=>Array.isArray(l)?l.join('::'):l)].join('\n');
const sgn=(x,d=1)=>(x>=0?'+':'')+(d?f1(x):String(Math.round(x)));
const LOWER=new Set(['TO','INT','SK','FUML']);
function toneOf(val,ref,key){
  const lower=LOWER.has(key);
  if(st.mark!=null){const hit=val>=st.mark,good=lower?!hit:hit;return {c:good?'up':'dn',t:1}}
  if(!Number.isFinite(ref))return {c:'eq',t:0};
  let d=(val-ref)/Math.max(Math.abs(ref),1);if(lower)d=-d;
  if(Math.abs(d)<.06)return {c:'eq',t:0};
  return {c:d>0?'up':'dn',t:clamp(Math.abs(d)/.5,.35,1)};
}
const toneFill=tn=>tn.c==='eq'?'color-mix(in oklab,var(--mut) 42%,var(--card))':`color-mix(in oklab,var(--${tn.c==='up'?'good':'bad'}) ${Math.round(50+50*tn.t)}%,var(--card))`;
const toneCell=tn=>tn.c==='eq'?'':` style="background:color-mix(in oklab,var(--${tn.c==='up'?'good':'bad'}) ${Math.round(12+26*tn.t)}%,transparent)"`;

function bars(svg,rows,withYear,ref){
  const draw=()=>{
    const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
    const fn=statDef()[2],pr=played(rows);
    if(!pr.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mut)" font-size="15">No games in this view</text>`;return}
    const vals=pr.map(fn),mx=Math.max(1,...vals,st.mark||0)*1.12,av=mean(vals);
    const padT=22,padB=withYear?40:28,padL=W<520?6:34,padR=6,cw=(W-padL-padR)/pr.length,bw=Math.max(2,Math.min(46,cw*.72));
    const y=val=>padT+(H-padT-padB)*(1-Math.max(0,val)/mx);
    const sd=statDef(),rf=Number.isFinite(ref)?ref:av;
    let s='';
    if(W>=520){const step=mx>250?50:mx>100?25:mx>40?10:mx>16?5:mx>6?2:1;for(let t=0;t<=mx;t+=step)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${t}</text>`}
    pr.forEach((r,i)=>{const val=fn(r),x=padL+cw*i+(cw-bw)/2,g=D.games[r[0]],o=D.teams[r[2]];
      const tn=toneOf(val,rf,sd[0]),fill=toneFill(tn),rb=cfg().restB(restOf(r[1],r[0]));
      const tip=T(`${cfg().dateLbl(g,true)} · ${r[3]?'vs':'@'} ${o.a}`,[sd[1],fv(val),tn.c==='eq'?'b':tn.c],st.mark==null?['vs '+(withYear?'his usual':'this view\'s avg'),sgn(val-rf),tn.c]:['Your mark '+st.mark,(val>=st.mark)?'Hit':'Missed',tn.c],[r[4]?'Win':'Loss',`${r[5]}-${r[6]}`],L==='nba'?['Minutes',v(r,'MIN')]:['Fantasy pts',fv(v(r,'FPTS'))],['Spot',`${r[3]?'Home':'Away'}${rb?' · '+cfg().restLbl[rb].toLowerCase():''}`]);
      s+=`<g style="--i:${i}" data-tip="${esc(tip)}">`;
      s+=`<rect class="bar" x="${x}" y="${y(val)}" width="${bw}" height="${Math.max(0,y(0)-y(val))}" rx="${Math.min(5,bw/4)}" fill="${fill}"/>`;
      if(cw>=18)s+=`<text class="bv" x="${x+bw/2}" y="${y(val)-6}" text-anchor="middle" font-size="${cw>30?13:11}" font-weight="600" fill="var(--ink)">${esc(fv(val))}</text>`;
      if(cw>=36)s+=`<text x="${x+bw/2}" y="${H-padB+15}" text-anchor="middle" font-size="11" fill="var(--mut)">${r[3]?'':'@'}${esc(o.a)}</text>`;
      if(withYear&&cw>=44)s+=`<text x="${x+bw/2}" y="${H-padB+30}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(g[0].slice(0,4))}</text>`;
      s+='</g>'});
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(av)}" y2="${y(av)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    s+=`<text x="${padL+4}" y="${y(av)-6}" font-size="12" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">avg ${f1(av)}</text>`;
    if(st.mark!=null)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(st.mark)}" y2="${y(st.mark)}" stroke="var(--acc)" stroke-width="2"/><text x="${W-padR-4}" y="${y(st.mark)-6}" text-anchor="end" font-size="12" font-weight="600" fill="var(--acc)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">${esc(st.mark)}</text>`;
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mut)"/>`;
    svg.innerHTML=s;
  };
  if(svg._ro)svg._ro.disconnect();
  let first=true;svg._ro=new ResizeObserver(()=>{if(first){first=false;return}draw()});svg._ro.observe(svg);draw();
}

// ---------------- defense vs position
// Plain-language matchup verdict: compares what a defense allows to a position against the league average.
function verdictOf(pct){return pct>=.08?['Great matchup','good','v-great']:pct>=.03?['Good matchup','good','v-good']:pct<=-.08?['Very tough matchup','bad','v-vtough']:pct<=-.03?['Tough matchup','bad','v-tough']:['Average matchup','mut','v-avg']}
function matchupOf(t,b){
  const dv=D.dvp&&D.dvp[b];if(!dv||!dv.n[t]||dv.rank[t].some(x=>x==null))return null;
  const rows=dv.k.map((k,i)=>({k,a:dv.avg[t][i],lg:dv.lg[i],rk:dv.rank[t][i],pct:dv.lg[i]?dv.avg[t][i]/dv.lg[i]-1:0}));
  // overall verdict rides on the all-in-one stat: pts+reb+ast (NBA) or PPR fantasy points (NFL)
  const sum=rows.find(r=>r.k==='PRA'||r.k==='FPTS'),pct=sum?sum.pct:mean(rows.map(r=>r.pct));
  return {rows,pct,sum,n:dv.n[t],v:verdictOf(pct)};
}
function tierOf(t){const m=P.b?matchupOf(t,P.b):null;return m?[m.v[0],m.v[1]==='good'?'var(--good)':m.v[1]==='bad'?'var(--bad)':'var(--mut)']:null}
const rate=pct=>pct>=.05?['Good for him','good']:pct<=-.05?['Bad for him','bad']:['About even','mut'];
function dvpHtml(){
  const c=cfg(),b=P.b,o=D.teams[st.opp];
  if(!b||!o)return `<p class="empty">No position matchup data for this player.</p>`;
  const m=matchupOf(st.opp,b);if(!m)return `<p class="empty">The ${esc(o.n)} haven't played yet this season.</p>`;

// model v2 settings, tuned on this season's back-test (see the Accuracy page)

const GPL={nba:{wr:.3,ws:.6,wl:.1,dm:.25,dl:0,dr:0,dor:0,med:0,mw:.5,ab:.1,dp:0,qb:1},nfl:{wr:.3,ws:.6,wl:.1,dm:.25,dl:.25,dr:.25,dor:.25,med:.5,mw:0,ab:.1,dp:0,qb:.7}};

const GP={...GPL.nba};const GPL0=JSON.parse(JSON.stringify(GPL));window.__glParams=o=>{for(const k in GPL)Object.assign(GPL[k],GPL0[k],o);Object.assign(GP,GPL[L],o);return GP};

  for(const q of mates){
    const qr=q.g.filter(r=>r[1]===t&&seasons.includes(gd(r[0])[1]));if(!qr.length)continue;

    const span={};for(const r of qr){const g=gd(r[0]);const s=span[g[1]]||(span[g[1]]=[g[0],g[0]]);if(g[0]<s[0])s[0]=g[0];if(g[0]>s[1])s[1]=g[0]}

    if(wo.length<2||w.length<3)continue;
    const a=mean(w.map(fn)),b=mean(wo.map(fn)),mins=L==='nba'?[mean(w.map(r=>v(r,'MIN'))),mean(wo.map(r=>v(r,'MIN')))]:null;
    rows.push({q,inj,a,b,nw:w.length,nwo:wo.length,d:b-a,mins});

  const wt=x=>Math.abs(x.d)*Math.min(1,x.nwo/8);rows.sort((x,y)=>(!!(y.inj&&isOut(y.inj))-!!(x.inj&&isOut(x.inj)))||wt(y)-wt(x));

    return `<tr class="${out?'now':''}" tabindex="0" data-tip="${esc(T(`${P.n} without ${x.q.n}`,[`${label} with`,`${f1(x.a)} (${x.nw} g)`],[`${label} without`,`${f1(x.b)} (${x.nwo} g)`,cl],x.mins?['Minutes with / without',`${f1(x.mins[0])} / ${f1(x.mins[1])}`]:null,x.nwo<5?'~Small sample: only a few games without him.':null,out?`~${x.q.n} is listed ${x.inj.s.toLowerCase()} now.`:null))}"><td>${playerLink(x.q,esc(x.q.n))} <small class="mutd">${esc(x.q.p)}</small></td><td>${x.inj?`<span class="s" style="--sc:${SCOL(x.inj.s)}">${esc(x.inj.s)}</span>`:'<small class="mutd">Active</small>'}</td><td>${f1(x.a)} <small class="mutd">${x.nw} g</small></td><td><b>${f1(x.b)}</b> <small class="mutd">${x.nwo} g${x.nwo<5?' · small sample':''}</small></td><td class="${cl}"><b>${x.d>=0?'+':''}${f1(x.d)}</b></td></tr>`}).join('')}</tbody></table></div>`
  :`<p class="quiet">No teammate has missed enough games alongside him to compare yet.</p>`}`;

  const chips=(key,opts)=>`<div class="grp" data-pf="${key}">${opts.map(([v_,l])=>`<button class="chip" data-v="${v_}" aria-pressed="${PF[key]===v_}">${l}</button>`).join('')}</div>`;
  const resCls={win:'good',loss:'bad',push:'mut',void:'mut',pending:'acc'};
  $('picksBody').innerHTML=`<section class="blk rv"><div class="accf">${chips('lg',[['all','All leagues'],['nba','NBA'],['nfl','NFL']])}${chips('st',[['all','All'],['pending','Pending'],['graded','Graded']])}</div>
    ${all.length?`<div class="kpis">
      <div class="kpi"><b>${W}-${Lo}${Pu?'-'+Pu:''}</b><small>record (W-L${Pu?'-P':''})</small></div>
      <div class="kpi"><b class="${W+Lo&&W/(W+Lo)>=.5?'up':'dn'}">${W+Lo?Math.round(W/(W+Lo)*100)+'%':'–'}</b><small>hit rate</small></div>
      <div class="kpi"><b class="${net>=0?'up':'dn'}">${withNet.length?(net>=0?'+':'')+net.toFixed(2)+'u':'–'}</b><small>${withNet.length?`units on ${withNet.length} picks with a payout entered (${risk.toFixed(1)}u risked)`:'add "units to win" when logging to track units'}</small></div>
      <div class="kpi"><b>${rows.filter(x=>x.g.st==='pending').length}</b><small>pending</small></div></div>
      ${done.length?`<div class="acc2"><div><h3>By stat</h3><table class="sp"><thead><tr><th>Stat</th><th>Record</th><th>Hit</th></tr></thead><tbody>${grp(x=>`${x.pk.lg.toUpperCase()} ${statName(x.pk.stat)}`)}</tbody></table></div><div><h3>Over vs under</h3><table class="sp"><thead><tr><th>Side</th><th>Record</th><th>Hit</th></tr></thead><tbody>${grp(x=>x.pk.side==='over'?'Over':'Under')}</tbody></table></div></div>`:''}`
    :`<p class="quiet">No picks yet. Open any player, go to the Hit rates table, set a line and tap "Log".</p>`}</section>
    ${rows.length?`<section class="blk rv"><h2>Picks</h2><div class="scroll"><table class="sp pkt"><thead><tr><th>Game</th><th>Player</th><th>Pick</th><th>Units</th><th>Actual</th><th>Result</th><th></th></tr></thead><tbody>${rows.map(({pk,g})=>`<tr><td>${esc(pk.date.slice(5))} <small class="mutd">${esc(pk.lg.toUpperCase())}</small></td><td><a href="#p-${pk.lg}-${encodeURIComponent(pk.pid)}">${esc(pk.name)}</a> <small class="mutd">${esc(pk.team)} vs ${esc(pk.opp)}</small></td><td>${pk.side==='over'?'Over':'Under'} ${esc(pk.line)} ${esc(statName(pk.stat))}</td><td>${esc(pk.units)}u${pk.win!=null?` <small class="mutd">to win ${esc(pk.win)}</small>`:''}</td><td>${g.a!=null?esc(fv(g.a)):'–'}</td><td><span class="mu-chip ${resCls[g.st]}">${esc(g.st==='void'?(g.note||'void'):g.st)}</span>${g.net!=null&&g.st!=='pending'?` <small class="${g.net>=0?'up':'dn'}">${g.net>=0?'+':''}${g.net.toFixed(2)}u</small>`:''}</td><td><button class="unstar" data-del="${esc(pk.id)}" aria-label="Delete pick">×</button></td></tr>`).join('')}</tbody></table></div></section>`:''}`;
  reveal($('picksBody'));
}
$('picksView').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){const a=picks(),i=a.findIndex(x=>x.id===d.dataset.del);if(i>=0&&a.splice(i,1))save();renderPicksBody();return}
  const b=e.target.closest('[data-pf] .chip');if(b){PF[b.parentNode.dataset.pf]=b.dataset.v;renderPicksBody();for(const el of $('picksBody').querySelectorAll('.rv'))el.classList.add('on')}});

// ---------------- stat partners (teammate correlations) for team pages
function partnerKey(p){return L==='nba'?'PRA':({QB:'PYD',RB:'R+R YDS',WR:'RECYD',TE:'RECYD'})[p.p]||'FPTS'}
function corr(a,b){const n=a.length,ma=mean(a),mb=mean(b);let sab=0,sa=0,sb=0;for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;sab+=x*y;sa+=x*x;sb+=y*y}return sa&&sb?sab/Math.sqrt(sa*sb):0}
function partners(t){
  const cs=curSeason(),ok=r=>!isDNP(r)&&r[1]===t&&D.games[r[0]][1]>=cs-1;
  const ps=D.players.filter(p=>p.t===t&&roleOf(p)>=(L==='nba'?18:6)).sort((x,y)=>roleOf(y)-roleOf(x)).slice(0,10);
  const fnOf=p=>{const k=partnerKey(p),sd=withP(p,()=>posCfg().stats.find(s=>s[0]===k));return [k,sd?sd[2]:null]};
  const out=[];
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j],[ka,fa]=fnOf(a),[kb,fb]=fnOf(b);if(!fa||!fb)continue;
    const mb=new Map(b.g.filter(ok).map(r=>[r[0],r]));const xs=[],ys=[];for(const r of a.g.filter(ok)){const q=mb.get(r[0]);if(q){xs.push(fa(r));ys.push(fb(q))}}
    if(xs.length<8)continue;out.push({a,b,ka,kb,r:corr(xs,ys),n:xs.length})}
  return out;
}
function partnersHtml(t){
  const ps=partners(t);if(!ps.length)return '<p class="quiet">Not enough shared games yet.</p>';
  const pos=ps.filter(x=>x.r>=.25).sort((x,y)=>y.r-x.r).slice(0,5),neg=ps.filter(x=>x.r<=-.2).sort((x,y)=>x.r-y.r).slice(0,5);
  const row=x=>`<li tabindex="0" data-tip="${esc(T(`${x.a.n} + ${x.b.n}`,['Correlation',x.r.toFixed(2),x.r>0?'up':'dn'],['Shared games',x.n],`~${x.r>0?'When one has a big game, the other tends to as well':'When one has a big game, the other tends to have a quieter one'} (${statName(x.ka)} vs ${statName(x.kb)}). 0 = no link, 1 = always move together.${x.n<15?' Small sample.':''}`))}"><span>${playerLink(x.a,esc(x.a.n))} <small class="mutd">${esc(statName(x.ka))}</small> + ${playerLink(x.b,esc(x.b.n))} <small class="mutd">${esc(statName(x.kb))}</small></span><b class="${x.r>0?'up':'dn'}">${x.r>0?'+':''}${x.r.toFixed(2)}</b></li>`;
  return `<div class="acc2"><div><h3>Move together</h3>${pos.length?`<ul class="prt">${pos.map(row).join('')}</ul>`:'<p class="quiet">No strong pairs.</p>'}</div><div><h3>Cancel out</h3>${neg.length?`<ul class="prt">${neg.map(row).join('')}</ul>`:'<p class="quiet">No pairs that clearly cancel out.</p>'}</div></div>`;
}

// ---------------- compare two players
function cmpCard(p){return withP(p,()=>{
  const ng=nextGame(p.t),o=ng?D.teams[ng[1]===p.t?ng[2]:ng[1]]:null,mi=injOf(p),mu=o&&p.b?matchupOf(D.teams.indexOf(o),p.b):null;
  return `<div class="cmpc" style="--tcb:#${esc(D.teams[p.t].c)}">${logoImg(D.teams[p.t])}<div><h2>${playerLink(p,esc(p.n))}</h2><p class="sub">${esc(D.teams[p.t].n)} · ${esc(p.p)}${mi?` · <em style="color:${SCOL(mi.s)}">${esc(mi.s)}</em>`:''}</p>
    <p class="sub">${ng?`Next: ${ng[1]===p.t?'vs':'@'} ${esc(o.a)} · ${esc(new Date(ng[0]).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}))}`:'No upcoming game'}${mu?` · <span class="mu-chip ${mu.v[1]}">${esc(mu.v[0])}</span>`:''}</p></div></div>`})}
function renderCmp(a,b){
  setTheme(D.teams[a.t].c);const box=$('cmpView');
  if(!b){box.innerHTML=`<div class="hwrap"><section class="blk"><h2>Compare ${esc(a.n)} with…</h2><p class="sub">Search for a second ${esc(cfg().name)} player.</p><div class="srch cmps"><input id="cq" type="search" placeholder="Search a player…" autocomplete="off" aria-label="Player to compare"><div class="dd" id="cdd"></div></div></section></div>`;
    const q=$('cq'),dd=$('cdd');q.focus();
    q.addEventListener('input',()=>{const v_=norm(q.value);if(!v_){dd.classList.remove('on');return}const h=D.players.filter(p=>p!==a&&p._k.includes(v_)).sort((x,y)=>(y._k.startsWith(v_)-x._k.startsWith(v_))||(y._m-x._m)).slice(0,10);
      dd.innerHTML=h.map(p=>`<button data-id="${esc(p.id)}"><span class="nm">${esc(p.n)}</span><small>${esc(D.teams[p.t].a)} · ${esc(p.p)}</small></button>`).join('')||'<div class="empty" style="padding:14px">No player found</div>';dd.classList.add('on')});
    dd.addEventListener('click',e=>{const x=e.target.closest('[data-id]');if(x)go(`cmp-${L}-${encodeURIComponent(a.id)}_${encodeURIComponent(x.dataset.id)}`)});
    return}
  const ka=KEYS[L].show(a),kb=KEYS[L].show(b),keys=[...new Set([...ka.filter(k=>kb.includes(k)),...(ka.some(k=>kb.includes(k))?[]:['FPTS'])])].filter(k=>k);
  const sa=spotOf(a),sb=spotOf(b);
  const val=(p,sp,k)=>withP(p,()=>{const sd=posCfg().stats.find(s=>s[0]===k);if(!sd)return null;const cur=seasonRows(p),rec=played(p.g).slice(-cfg().projN),x=sp&&sp.stats[k];
    return {sd,season:mean(cur.map(sd[2])),rec:mean(rec.map(sd[2])),proj:x?x.pr.proj:null,fl:x?x.pr.floor:null,up:x?x.pr.up:null,last:played(p.g).slice(-10).map(sd[2])}});
  const rows=keys.map(k=>{const A=val(a,sa,k),B=val(b,sb,k);if(!A||!B)return '';const mx=Math.max(1,...A.last,...B.last);
    const cell=(x,y,d=1)=>`<td class="${x!=null&&y!=null&&Math.abs(x-y)>.05?(x>y?'win':''):''}">${x==null?'–':f1(x)}</td>`;
    const strip=X=>`<span class="strip">${X.last.map(x=>`<i style="height:${Math.max(4,x/mx*100)}%" title="${esc(fv(x))}"></i>`).join('')}</span>`;
    return `<tbody class="cmpb"><tr class="ch"><th colspan="3">${esc(A.sd[1])}</th></tr>
      <tr><td>${strip(A)}</td><td class="lbl">Last 10 games</td><td>${strip(B)}</td></tr>
      <tr>${cell(A.season,B.season)}<td class="lbl">Season average</td>${cell(B.season,A.season)}</tr>
      <tr>${cell(A.rec,B.rec)}<td class="lbl">Last ${cfg().projN}</td>${cell(B.rec,A.rec)}</tr>
      <tr>${cell(A.proj,B.proj)}<td class="lbl"><b>Next-game projection</b></td>${cell(B.proj,A.proj)}</tr>
      <tr><td>${A.fl!=null?`${f1(A.fl)}–${f1(A.up)}`:'–'}</td><td class="lbl">Floor–upside</td><td>${B.fl!=null?`${f1(B.fl)}–${f1(B.up)}`:'–'}</td></tr></tbody>`}).join('');
  box.innerHTML=`<div class="hwrap"><div class="cmpg">${cmpCard(a)}${cmpCard(b)}</div><section class="blk rv"><h2>Side by side</h2><p class="sub">The higher number in each row is bold. Projections are for each player's next game.</p><div class="scroll"><table class="cmpt">${rows}</table></div>
    <p class="fine"><a href="#cmp-${L}-${encodeURIComponent(a.id)}">Swap ${esc(b.n)} for someone else</a></p></section></div>`;
}

// ---------------- start
fetch('news.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null).then(n=>{N=n||{updated:null};if(!D)return;
  if(VIEW==='player'&&P)renderContext();else if(VIEW==='home'){renderHome();reveal($('homeView'))}else route()});
route();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
