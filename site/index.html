<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Game Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical box-score desk, numbers first, no odds, no hype.
   IDEA: a printed scouting card — team-colour masthead with the matchup ticket, over agate game logs.
   PICTURE: the masthead matchup (team marks facing off) and the game-by-game bar strip.
   COLOUR and TYPE: white sheet / night court; the player's team colour leads, ink support, court orange as the one accent; Barlow Condensed figures + Barlow text.
   LAYOUT: search bar, slim masthead with averages, then two columns: stats + matchup on the left, matchup ticket, injuries and news in a sticky right rail. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1115);--ink:light-dark(#14161a,#eceef2);--mut:light-dark(#646a73,#9aa1ab);--line:light-dark(#e3e5e9,#262a31);--soft:light-dark(#f4f5f7,#171a20);--card:light-dark(#fff,#14171d);--acc:#f26b1d;--good:light-dark(#1a7f37,#4ac26b);--warn:light-dark(#b26a00,#f0b429);--bad:light-dark(#c62828,#ff6b6b);--tc:#1d428a;--oc:#555;--tcb:light-dark(var(--tc),color-mix(in oklab,var(--tc) 50%,white));--tink:#fff;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(18px,3vw,36px) max(5vw,16px)}
.wrap{max-width:1440px;margin:0 auto}
h1,h2,h3,.big,.chip,.num{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif}
svg{font-family:Barlow,system-ui,sans-serif}
a{color:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:12px}
.top .wrap{max-width:1440px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lg{position:relative;display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:999px;border:1px solid var(--line)}
.lg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:999px;background:var(--ink);box-shadow:0 2px 8px rgb(0 0 0/.18);transition:left .35s var(--ease),width .35s var(--ease)}
.lg .chip{position:relative;z-index:1;min-height:40px;padding:0 16px;font-size:18px;border:0;background:transparent;transition:color .3s}
.lg .chip[aria-pressed=true]{background:transparent;color:var(--bg)}
.srch{position:relative;flex:1 1 180px;max-width:560px}
.srch input{width:100%;font:16px Barlow,sans-serif;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);min-height:46px;transition:border-color .2s,box-shadow .2s}
.srch svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--mut)}
.srch input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in oklab,var(--acc) 20%,transparent)}
.dd{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgb(0 0 0/.2);max-height:380px;overflow:auto;opacity:0;translate:0 -6px;pointer-events:none;transition:opacity .16s,translate .16s var(--ease)}
.dd.on{opacity:1;translate:0 0;pointer-events:auto}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;min-height:48px;border:0;background:none;color:var(--ink);font:15px Barlow,sans-serif;cursor:pointer}
.dd button:hover,.dd button.hl{background:var(--soft)}
.dd .nm{flex:1}.dd small{color:var(--mut)}
.dd img{width:26px;height:26px;object-fit:contain}
.thru{color:var(--mut);font-size:13px}
/* masthead */
.mast{position:relative;overflow:hidden;color:var(--tink);background:linear-gradient(120deg,var(--tc) 0%,color-mix(in oklab,var(--tc) 72%,black) 62%,color-mix(in oklab,var(--oc) 55%,black) 100%);transition:background .5s}
.mast .wm{position:absolute;right:-60px;top:50%;translate:0 -50%;width:min(520px,70vw);opacity:.1;pointer-events:none;filter:grayscale(.2)}
.mast{padding-block:clamp(16px,2.4vw,28px)}
.mast .wrap{position:relative;max-width:1440px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:16px 28px;align-items:center}
.who{display:flex;gap:18px;align-items:center}
.mono{flex:none;width:clamp(76px,10vw,104px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.12);border:3px solid rgb(255 255 255/.55);box-shadow:inset 0 -10px 24px rgb(0 0 0/.2);font:800 clamp(32px,4.5vw,46px)/1 "Barlow Condensed",sans-serif;letter-spacing:-.01em}
h1{font-size:clamp(32px,4.4vw,48px);line-height:1.02;margin:0;font-weight:700;text-wrap:balance}
.meta{opacity:.85;margin-top:4px}
.stat-pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px;background:#fff;color:#111}
.stat-pill i{width:8px;height:8px;border-radius:50%;background:var(--sc,#999)}
.ticket{color:var(--tink);background:linear-gradient(135deg,var(--tc),color-mix(in oklab,var(--tc) 55%,black) 60%,color-mix(in oklab,var(--oc) 70%,black));border-radius:16px;padding:16px 18px;box-shadow:0 10px 28px rgb(0 0 0/.18)}
.face a{color:inherit;text-decoration:none}.when a{color:inherit;font-weight:700}
.face{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.face img{width:clamp(54px,7vw,76px);height:clamp(54px,7vw,76px);object-fit:contain;filter:drop-shadow(0 6px 10px rgb(0 0 0/.3))}
.face .lbl{font:700 18px "Barlow Condensed",sans-serif;margin-top:2px}
.face .vsx{font:800 22px "Barlow Condensed",sans-serif;opacity:.75}
.logo-fb{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgb(255 255 255/.15);font:800 22px "Barlow Condensed",sans-serif}
.when{text-align:center;margin-top:8px;font-weight:500}
.ctx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.ctx span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgb(255 255 255/.16)}
.ctx span.hot{background:#fff;color:#111}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{background:rgb(255 255 255/.1);border-radius:10px;padding:8px 10px}
.tile .big{font-size:30px;line-height:1;font-weight:700}
.tile small{display:block;opacity:.8;font-size:13px}
/* two-column layout */
.layout{max-width:1440px;margin:0 auto;padding:clamp(16px,2.4vw,28px) max(4vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:24px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:24px}
.col-side{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.2vw,26px)}
.match{background:var(--soft)}
.match .head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.match .head h2{display:flex;align-items:center;gap:10px}
.match .head h2 img{width:40px;height:40px;object-fit:contain}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 8px}
.card h3{display:flex;align-items:center;gap:8px;font-size:20px;margin:0 0 6px}
.card h3 img{width:24px;height:24px;object-fit:contain}
.card h3 small{margin-left:auto;font:500 13px Barlow,sans-serif;color:var(--mut)}
.inj{list-style:none;margin:0;padding:0}
.inj li{border-top:1px solid var(--line)}
.inj details{padding:8px 0}
.inj summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none}
.inj summary::-webkit-details-marker{display:none}
.inj .n{font-weight:600}.inj .p{color:var(--mut);font-size:13px}
.inj .s{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--sc)}
.inj .w{display:block;color:var(--mut);font-size:13px}
.inj .c{font-size:14px;margin:6px 0 2px;color:var(--ink)}
.inj .flag{font-size:11px;font-weight:700;color:var(--acc);margin-left:4px}
.inj li.me{background:color-mix(in oklab,var(--acc) 10%,transparent);border-radius:8px;padding-inline:6px}
.more{border:0;background:none;color:var(--acc);font:600 14px Barlow,sans-serif;padding:8px 0;cursor:pointer;min-height:40px}
.news{list-style:none;margin:0;padding:0}
.news li{border-top:1px solid var(--line);padding:9px 0}
.news a{font-weight:600;text-decoration:none;line-height:1.3;display:block}
.news a:hover{text-decoration:underline;text-decoration-color:var(--acc)}
.news small{color:var(--mut);font-size:13px}
.news .tg{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--soft);border:1px solid var(--line);margin-right:6px;color:var(--ink)}
.news .tg.me{background:var(--acc);border-color:var(--acc);color:#fff}
.quiet{color:var(--mut);font-size:14px;padding:6px 0 10px;margin:0}
/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp>span{font-size:13px;color:var(--mut);margin-right:4px}
.chip{font-size:15px;font-weight:600;flex:none;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;cursor:pointer;transition:background .18s,color .18s,border-color .18s,scale .12s}
.chip:hover{border-color:var(--mut)}
.chip:active{scale:.95}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.more:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mark input,select{font:16px Barlow,sans-serif;min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.mark input{width:90px}
h2{font-size:32px;line-height:1.05;margin:0 0 4px;font-weight:700}
h3{font-size:24px;line-height:1.1;margin:0;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px}
.sum{display:flex;flex-wrap:wrap;gap:8px 22px;margin:4px 0 10px;align-items:baseline}
.sum .big{font-size:42px;font-weight:700;line-height:1}
.sum .hit{color:var(--acc);font-weight:600}
.fig{position:relative;min-height:300px;border-bottom:1px solid var(--line)}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{transform-box:fill-box;transform-origin:bottom;transition:opacity .2s}
.fig svg g:hover .bar{opacity:.78}
.avgs{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.avgs div{flex:1 1 84px;background:var(--card);padding:9px 11px}
.avgs .big{font-size:25px;font-weight:600;line-height:1.1;display:block}
.avgs small{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mut);font-size:13px;background:var(--bg)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--soft)}
td.hl{font-weight:700}
tr.dnp td{color:var(--mut)}
.tag{font-size:11px;font-weight:600;color:var(--acc);margin-left:4px}
.W{color:var(--good)}.L{color:var(--bad)}
/* polish */
[hidden]{display:none!important}
::selection{background:color-mix(in oklab,var(--acc) 30%,transparent)}
.crumb{max-width:1440px;margin:0 auto;padding:10px max(4vw,16px) 0;font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--ink);font-weight:600;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);transition:background .2s}
.crumb a:hover{background:var(--line)}
.rv{opacity:0;translate:0 16px;transition:opacity .55s var(--ease),translate .55s var(--ease)}
.rv.on{opacity:1;translate:0 0}
.gcard.rv{transition-delay:calc(var(--i,0)*35ms)}
.hero{position:relative;overflow:hidden}
.hero .art{position:absolute;right:-20px;top:50%;translate:0 -50%;height:130%;width:auto;opacity:.2;pointer-events:none}
.hero .art *{fill:none;stroke:#fff;stroke-width:3}
.hero .art text{fill:#fff;stroke:none;font:700 26px "Barlow Condensed",sans-serif}
.hero .wrap{position:relative}
.hstrip{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hstrip>*{display:flex;flex-direction:column;justify-content:center;min-width:130px;padding:10px 14px;border-radius:12px;background:rgb(255 255 255/.12);border:1px solid rgb(255 255 255/.18);color:inherit;text-decoration:none;transition:background .2s,translate .2s var(--ease)}
.hstrip a:hover{background:rgb(255 255 255/.2);translate:0 -2px}
.hstrip b{font:800 28px/1 "Barlow Condensed",sans-serif}.hstrip small{opacity:.8;font-size:13px}
.gcard{position:relative;overflow:hidden;padding-left:18px}
.gcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--ac,#888) 50%,var(--hc,#888) 50%)}
.gcard .gt img{transition:scale .25s var(--ease)}.gcard:hover .gt img{scale:1.12}
.gtime{display:flex;justify-content:space-between;gap:8px}.gtime .cd{color:var(--acc);font-weight:700}
.em{display:block;width:96px;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.em i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,color-mix(in oklab,var(--good) 55%,transparent),var(--good));transform-origin:left}
.rrow,.fav{position:relative}
.rrow::before,.fav::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--tcb);opacity:0;transition:opacity .2s}
.rrow:hover::before,.fav:hover::before{opacity:1}
.tape{display:flex;flex-direction:column;gap:2px}
.tape-h{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);align-items:center;gap:10px;margin-bottom:6px;font:700 20px "Barlow Condensed",sans-serif}
.tape-h span:first-child{text-align:right}.tape-h .logo-fb{width:28px;height:28px;font-size:11px;margin:0 6px;vertical-align:middle}.tape-h .tvs{text-align:center;color:var(--mut);font-size:16px}.tape-h img{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin:0 6px}
.tape-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 150px 64px minmax(0,1fr);align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.tv{font:600 19px "Barlow Condensed",sans-serif;color:var(--mut);font-variant-numeric:tabular-nums}.tv.l{text-align:right}.tv.r{text-align:left}.tv.win{color:var(--ink);font-weight:800}
.tl{text-align:center;font-size:13px;color:var(--mut);font-weight:600}
.tctx{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);cursor:help}.tctx.l{justify-content:flex-end}
.trk{font:700 15px "Barlow Condensed",sans-serif;padding:1px 8px;border-radius:999px;min-width:44px;text-align:center}
.trk.good{background:color-mix(in oklab,var(--good) 16%,transparent);color:var(--good)}.trk.bad{background:color-mix(in oklab,var(--bad) 14%,transparent);color:var(--bad)}.trk.mut{background:var(--soft);color:var(--mut)}
.tdv{white-space:nowrap;font-variant-numeric:tabular-nums}
.tm{flex:1;max-width:160px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}.tctx.l .tm{justify-content:flex-end}
.tm i{display:block;height:100%;border-radius:3px;background:var(--mut);transform-origin:left}.tctx.l .tm i{transform-origin:right}.tm.none{background:none}.tm.good i{background:var(--good)}.tm.bad i{background:var(--bad)}
.tb{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}.tb.l{justify-content:flex-end}
.tb i{display:block;height:100%;border-radius:5px;background:var(--ac);opacity:.45;transition:opacity .2s}.tb.r i{background:var(--hc)}.tb i.win{opacity:1}
@media(max-width:640px){.tape-row{grid-template-columns:minmax(0,1fr) 44px 92px 44px minmax(0,1fr);gap:6px}.tm,.tdv,.hm{display:none}.tape-h{grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr)}.tl{font-size:12px}.hero .art{opacity:.12}}
.sk2{border-radius:14px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s linear infinite}
@media(prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  .viewin{animation:vin .45s var(--ease) both}@keyframes vin{from{opacity:0;translate:0 10px}}
  .hero,.mast{background-size:180% 180%;animation:drift 18s ease-in-out infinite alternate}@keyframes drift{from{background-position:0% 50%}to{background-position:100% 50%}}
  .hero .art .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s var(--ease) forwards;animation-delay:calc(var(--d,0)*90ms)}@keyframes draw{to{stroke-dashoffset:0}}
  .hero .art text{animation:fade 1s .8s both}
  .em i,.tb i,.tm i{animation:wipe .9s var(--ease) both}.tb.l i{transform-origin:right}
}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;translate:none}}
/* nav + dashboard */
.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:800 20px "Barlow Condensed",sans-serif;padding:6px 4px;min-height:44px}
.brand svg{width:22px;height:22px;fill:var(--acc)}
.star{margin-left:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid rgb(255 255 255/.55);background:rgb(255 255 255/.1);color:inherit;font:700 15px "Barlow Condensed",sans-serif;cursor:pointer;transition:background .2s,scale .15s}
.star svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;transition:fill .2s}
.star[aria-pressed=true]{background:#fff;color:#111}.star[aria-pressed=true] svg{fill:#f5b400;stroke:#f5b400}
.star:active{scale:.94}.star.pop svg{animation:pop .45s var(--ease)}
.hero{color:var(--tink);background:linear-gradient(120deg,var(--tc),color-mix(in oklab,var(--tc) 60%,black));padding-block:clamp(20px,3vw,34px)}
.hero h1{margin:0}.hero p{margin:4px 0 0;opacity:.85}
.hwrap{max-width:1440px;margin:0 auto;padding:clamp(16px,2.4vw,28px) max(4vw,16px) 40px;display:flex;flex-direction:column;gap:22px}
.hcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.day{display:flex;align-items:baseline;gap:10px;font-size:22px;margin:4px 0 10px}.day small{font:500 14px Barlow,sans-serif;color:var(--mut)}
.day:not(:first-child){margin-top:20px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:translate .2s var(--ease),box-shadow .2s,border-color .2s}
.gcard:hover,.gcard:focus-visible{translate:0 -3px;box-shadow:0 12px 26px rgb(0 0 0/.1);border-color:var(--mut);outline:none}
.gtime{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:4px}
.gt{display:flex;align-items:center;gap:10px;padding:4px 0}.gt img,.gt .logo-fb{width:30px;height:30px;object-fit:contain;font-size:12px}
.gn{flex:1;font-weight:600}.gr{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.gtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.gtags span{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.gtags span.hot{background:color-mix(in oklab,var(--acc) 15%,transparent);border-color:color-mix(in oklab,var(--acc) 40%,transparent)}
.fav{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);text-decoration:none;border-radius:10px;transition:background .15s}
.fav:hover{background:var(--soft)}
.fr{font:800 22px "Barlow Condensed",sans-serif;color:var(--mut);text-align:center}
.fw b{display:block;font-size:17px}.fw small{color:var(--mut);font-size:13px}.fw em,.srow em,.rrow em{font-style:normal;font-weight:700}

{

function rangeRows(){
  let rows=P.g.slice();const cs=curSeason();
  if(st.loc==='home')rows=rows.filter(r=>r[3]===1);if(st.loc==='away')rows=rows.filter(r=>r[3]===0);
  if(st.range==='season')return rows.filter(r=>D.games[r[0]][1]===cs);
  if(st.range==='last')return rows.filter(r=>D.games[r[0]][1]===cs-1);
  if(st.range==='all')return rows;
  const n=+st.range,out=[];let k=0;
  for(let i=rows.length-1;i>=0&&k<n;i--){out.unshift(rows[i]);if(!isDNP(rows[i]))k++}
  return out;
}

function countUp(el,to){
  if(RM||!Number.isFinite(to)){el.textContent=f1(to);return}
  const t0=performance.now(),dur=650;
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-(1-p)**3;el.textContent=f1(to*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

// ---------------- tip markup + good/bad tones
const T=(title,...ls)=>[title,...ls.filter(x=>x!=null&&x!==false&&x!=='').map(l=>Array.isArray(l)?l.join('::'):l)].join('\n');
const sgn=(x,d=1)=>(x>=0?'+':'')+(d?f1(x):String(Math.round(x)));
const LOWER=new Set(['TO','INT','SK','FUML']);
function toneOf(val,ref,key){
  const lower=LOWER.has(key);
  if(st.mark!=null){const hit=val>=st.mark,good=lower?!hit:hit;return {c:good?'up':'dn',t:1}}
  if(!Number.isFinite(ref))return {c:'eq',t:0};
  let d=(val-ref)/Math.max(Math.abs(ref),1);if(lower)d=-d;
  if(Math.abs(d)<.06)return {c:'eq',t:0};
  return {c:d>0?'up':'dn',t:clamp(Math.abs(d)/.5,.35,1)};
}
const toneFill=tn=>tn.c==='eq'?'color-mix(in oklab,var(--mut) 42%,var(--card))':`color-mix(in oklab,var(--${tn.c==='up'?'good':'bad'}) ${Math.round(50+50*tn.t)}%,var(--card))`;
const toneCell=tn=>tn.c==='eq'?'':` style="background:color-mix(in oklab,var(--${tn.c==='up'?'good':'bad'}) ${Math.round(12+26*tn.t)}%,transparent)"`;
function legend(ref,what){const k=st.stat,lower=LOWER.has(k);
  if(st.mark!=null)return `<span class="lgd"><i class="up"></i>${lower?'under':'hit'} your mark of ${esc(st.mark)} <i class="dn"></i>${lower?'at or over':'missed'}</span>`;
  return `<span class="lgd"><i class="up"></i>${lower?'fewer':'better'} than ${what} (${f1(ref)}) <i class="dn"></i>${lower?'more':'worse'} <i class="eq"></i>about the same</span>`}

// ---------------- chart
function bars(svg,rows,withYear,ref){
  const draw=()=>{
    const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
    const fn=statDef()[2],pr=played(rows);
    if(!pr.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mut)" font-size="15">No games in this view</text>`;return}
    const vals=pr.map(fn),mx=Math.max(1,...vals,st.mark||0)*1.12,av=mean(vals);
    const padT=22,padB=withYear?40:28,padL=W<520?6:34,padR=6,cw=(W-padL-padR)/pr.length,bw=Math.max(2,Math.min(46,cw*.72));
    const y=val=>padT+(H-padT-padB)*(1-Math.max(0,val)/mx);
    const sd=statDef(),rf=Number.isFinite(ref)?ref:av;
    let s='';
    if(W>=520){const step=mx>250?50:mx>100?25:mx>40?10:mx>16?5:mx>6?2:1;for(let t=0;t<=mx;t+=step)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${t}</text>`}
    pr.forEach((r,i)=>{const val=fn(r),x=padL+cw*i+(cw-bw)/2,g=D.games[r[0]],o=D.teams[r[2]];
      const tn=toneOf(val,rf,sd[0]),fill=toneFill(tn),rb=cfg().restB(restOf(r[1],r[0]));
      const tip=T(`${cfg().dateLbl(g,true)} · ${r[3]?'vs':'@'} ${o.a}`,[sd[1],fv(val),tn.c==='eq'?'b':tn.c],st.mark==null?['vs '+(withYear?'his usual':'this view\'s avg'),sgn(val-rf),tn.c]:['Your mark '+st.mark,(val>=st.mark)?'Hit':'Missed',tn.c],[r[4]?'Win':'Loss',`${r[5]}-${r[6]}`],L==='nba'?['Minutes',v(r,'MIN')]:['Fantasy pts',fv(v(r,'FPTS'))],['Spot',`${r[3]?'Home':'Away'}${rb?' · '+cfg().restLbl[rb].toLowerCase():''}`]);
      s+=`<g style="--i:${i}" data-tip="${esc(tip)}">`;
      s+=`<rect class="bar" x="${x}" y="${y(val)}" width="${bw}" height="${Math.max(0,y(0)-y(val))}" rx="${Math.min(5,bw/4)}" fill="${fill}"/>`;
      if(cw>=18)s+=`<text class="bv" x="${x+bw/2}" y="${y(val)-6}" text-anchor="middle" font-size="${cw>30?13:11}" font-weight="600" fill="var(--ink)">${esc(fv(val))}</text>`;
      if(cw>=36)s+=`<text x="${x+bw/2}" y="${H-padB+15}" text-anchor="middle" font-size="11" fill="var(--mut)">${r[3]?'':'@'}${esc(o.a)}</text>`;
      if(withYear&&cw>=44)s+=`<text x="${x+bw/2}" y="${H-padB+30}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(g[0].slice(0,4))}</text>`;
      s+='</g>'});
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(av)}" y2="${y(av)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    s+=`<text x="${padL+4}" y="${y(av)-6}" font-size="12" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">avg ${f1(av)}</text>`;
    if(st.mark!=null)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(st.mark)}" y2="${y(st.mark)}" stroke="var(--acc)" stroke-width="2"/><text x="${W-padR-4}" y="${y(st.mark)-6}" text-anchor="end" font-size="12" font-weight="600" fill="var(--acc)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">${esc(st.mark)}</text>`;
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mut)"/>`;
    svg.innerHTML=s;
  };
  if(svg._ro)svg._ro.disconnect();
  let first=true;svg._ro=new ResizeObserver(()=>{if(first){first=false;return}draw()});svg._ro.observe(svg);draw();
}

function logTable(rows,withYear,ref){
  const pc=posCfg(),sd=statDef(),cols=pc.table,inTable=cols.some(c=>c[0]===st.stat&&!c[1]);
  let s=`<thead><tr><th>${L==='nfl'?'Game':'Date'}</th><th>Opp</th><th>Result</th>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}${inTable?'':`<th>${esc(st.stat)}</th>`}</tr></thead><tbody>`;
  for(const r of rows.slice().reverse()){
    const g=D.games[r[0]],o=D.teams[r[2]],tg=cfg().tag(g);
    const head=`<td>${esc(cfg().dateLbl(g,withYear||g[1]!==curSeason()))}${tg?`<span class="tag">${tg}</span>`:''}</td><td>${r[3]?'vs':'@'} ${esc(o.a)}</td><td><span class="${r[4]?'W':'L'}">${r[4]?'W':'L'}</span> ${r[5]}-${r[6]}</td>`;
    if(isDNP(r)){s+=`<tr class="dnp">${head}<td colspan="${cols.length+(inTable?0:1)}" style="text-align:left">Did not play</td></tr>`;continue}
    const val=sd[2](r),tc=toneCell(toneOf(val,ref,sd[0]));
    s+=`<tr>${head}${cols.map(c=>c[0]===st.stat&&!c[1]?`<td class="tc"${tc}>${esc(fv(val))}</td>`:`<td>${esc(c[1]?c[1](r):fv(v(r,c[0])))}</td>`).join('')}${inTable?'':`<td class="tc"${tc}>${esc(fv(val))}</td>`}</tr>`;
  }
  return s+'</tbody>';
}

const SCOL=s=>{s=(s||'').toLowerCase();return s.startsWith('out')||s.includes('reserve')||s.includes('suspend')?'var(--bad)':s.startsWith('doubt')?'#d9480f':s.startsWith('quest')||s.includes('day-to-day')?'var(--warn)':s.startsWith('prob')?'var(--good)':'var(--mut)'};

function injCard(t,isOwn){

// ---------------- defense vs position
// Plain-language matchup verdict: compares what a defense allows to a position against the league average.
function verdictOf(pct){return pct>=.08?['Great matchup','good','v-great']:pct>=.03?['Good matchup','good','v-good']:pct<=-.08?['Very tough matchup','bad','v-vtough']:pct<=-.03?['Tough matchup','bad','v-tough']:['Average matchup','mut','v-avg']}
function matchupOf(t,b){
  const dv=D.dvp&&D.dvp[b];if(!dv||!dv.n[t]||dv.rank[t].some(x=>x==null))return null;
  const rows=dv.k.map((k,i)=>({k,a:dv.avg[t][i],lg:dv.lg[i],rk:dv.rank[t][i],pct:dv.lg[i]?dv.avg[t][i]/dv.lg[i]-1:0}));
  // overall verdict rides on the all-in-one stat: pts+reb+ast (NBA) or PPR fantasy points (NFL)
  const sum=rows.find(r=>r.k==='PRA'||r.k==='FPTS'),pct=sum?sum.pct:mean(rows.map(r=>r.pct));
  return {rows,pct,sum,n:dv.n[t],v:verdictOf(pct)};
}
function tierOf(t){const m=P.b?matchupOf(t,P.b):null;return m?[m.v[0],m.v[1]==='good'?'var(--good)':m.v[1]==='bad'?'var(--bad)':'var(--mut)']:null}
const rate=pct=>pct>=.05?['Good for him','good']:pct<=-.05?['Bad for him','bad']:['About even','mut'];
function dvpHtml(){
  const c=cfg(),b=P.b,o=D.teams[st.opp];

  const m=matchupOf(st.opp,b);if(!m)return `<p class="empty">The ${esc(o.n)} haven't played yet this season.</p>`;
  const pos=c.posName[b],NT=D.teams.length,nk=nick(o),[vl,vc]=m.v,pp=Math.round(Math.abs(m.pct)*100);
  const lbl=k=>c.dvpLbl[k]||k;
  const best=m.rows.reduce((x,y)=>y.pct>x.pct?y:x),worst=m.rows.reduce((x,y)=>y.pct<x.pct?y:x);
  const P_=pos[0].toUpperCase()+pos.slice(1),sl=m.sum?lbl(m.sum.k):'production';
  let line=vc==='good'?`${P_} get about <b>${pp}% more ${esc(sl)}</b> against the ${esc(nk)} than against an average defense.`
    :vc==='bad'?`${P_} get about <b>${pp}% fewer ${esc(sl)}</b> against the ${esc(nk)} than against an average defense.`
    :`${P_} get about the same ${esc(sl)} against the ${esc(nk)} as against an average defense${pp?` (${m.pct>=0?'+':'−'}${pp}%)`:''}.`;
  if(best.pct>=.05)line+=` Their weakest area is <b>${esc(lbl(best.k))}</b> (${Math.round(best.pct*100)}% above average).`;
  if(worst.pct<=-.05)line+=` They're strongest at limiting <b>${esc(lbl(worst.k))}</b> (${Math.round(-worst.pct*100)}% below average).`;
  // the stat currently selected, in plain words
  const sd=statDef(),ds=defSplit(st.opp,b,sd[2]),dr=m.rows.find(r=>r.k===sd[0]),la=dr?dr.lg:leagueAllowed(b,sd[2]);if(dr)ds.all.avg=dr.a;
  const selPct=la>0&&ds.all.n?ds.all.avg/la-1:null,[sr,sc]=selPct==null?['','']:rate(LOWER.has(sd[0])?-selPct:selPct);
  const sel=selPct==null?'':`<div class="mu-sel"><span>For <b>${esc(sd[1].toLowerCase())}</b> specifically</span><b class="num">${f1(ds.all.avg)}</b><small>allowed per game to ${esc(pos)} vs ${f1(la)} for an average team</small><span class="mu-chip ${sc}">${sr}</span></div>`;
  const oppInj=injFor(st.opp);let inj='';
  if(oppInj){const rel=oppInj.filter(i=>cfg().oppFlag(i.p,P)&&!/^prob/i.test(i.s));if(rel.length)inj=`<p class="mu-note">Also: the ${esc(nk)} are missing or monitoring ${rel.slice(0,3).map(i=>`<b>${esc(i.n)}</b> (${esc(i.p)}, ${esc(i.s.toLowerCase())})`).join(', ')}${rel.length>3?` and ${rel.length-3} more`:''}. That isn't reflected in these season numbers, so the matchup may be easier than it looks.</p>`}
  const table=`<table class="mu-t"><thead><tr><th>Stat</th><th>${esc(pos[0].toUpperCase()+pos.slice(1))} get vs ${esc(nk)}</th><th>vs an average team</th><th>Difference</th><th>For him</th></tr></thead><tbody>${m.rows.map(r=>{const[rl,rc]=rate(r.pct);
    return `<tr tabindex="0" data-tip="${esc(T(`${lbl(r.k)}: ${nk} vs ${pos}`,[`Allowed per game`,f1(r.a),'b'],['Average team allows',f1(r.lg)],['Difference',`${r.a-r.lg>=0?'+':''}${f1(r.a-r.lg)} (${pctS(1+r.pct)})`,rc==='good'?'up':rc==='bad'?'dn':''],['League rank',`${ord(r.rk)} most of ${NT}`],'~Rank 1 means they give up the most, the easiest matchup.'))}"><td>${esc(lbl(r.k)[0].toUpperCase()+lbl(r.k).slice(1))}</td><td class="num">${f1(r.a)}</td><td class="num mutd">${f1(r.lg)}</td><td class="num ${rc==='good'?'up':rc==='bad'?'dn':''}">${r.a-r.lg>=0?'+':''}${f1(r.a-r.lg)} <small>(${pctS(1+r.pct)})</small></td><td><span class="mu-chip ${rc}">${rl}</span></td></tr>`}).join('')}</tbody></table>`;
  return `<div class="mu-head ${m.v[2]}"><div><small>Matchup vs the ${esc(nk)} for ${esc(pos)}</small><h3>${vl}</h3><p>${line}</p></div><div class="mu-big"><b>${m.pct>=0?'+':'−'}${pp}%</b><small>${esc(sl)} vs average defense</small></div></div>
  ${sel}<div class="scroll">${table}</div>
  <p class="mu-foot">Based on ${m.n} ${esc(nk)} games this season: everything players at his position (${esc(pos)}) combined for against them, per game. Hover a row for the league rank.</p>${inj}`;
}

// ---------------- situations: rest, home/away, splits
let TG=null;const DEFC={};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const pctS=m=>{const p=Math.round((m-1)*1000)/10;return (p>=0?'+':'')+p.toFixed(1)+'%'};
function buildTG(){TG={};const add=(t,g)=>{(TG[t]||(TG[t]=new Set())).add(g)};
  for(const p of D.players)for(const r of p.g){add(r[1],r[0]);add(r[2],r[0])}
  for(const t in TG){const arr=[...TG[t]].sort((a,b)=>a-b),m={};
    arr.forEach((g,i)=>{const pg=i?D.games[arr[i-1]]:null,cg=D.games[g];m[g]=pg&&pg[1]===cg[1]?dayDiff(pg[0],cg[0])-1:null});TG[t]=m}}
const restOf=(t,g)=>TG&&TG[t]?TG[t][g]:null;
const sitKeys=()=>['all','home','away',...cfg().restKeys];
function splitOf(rows,fn,teamOf){
  const g={};for(const k of sitKeys())g[k]=[];
  for(const r of rows){const x=fn(r);g.all.push(x);g[r[3]?'home':'away'].push(x);const rb=cfg().restB(restOf(teamOf(r),r[0]));if(rb)g[rb].push(x)}
  const o={};for(const k in g)o[k]={avg:mean(g[k]),n:g[k].length};return o}
function playerWin(){const cs=curSeason();return played(P.g).filter(r=>D.games[r[0]][1]>=cs-1)}
function defGames(b){const key=L+b;if(DEFC[key])return DEFC[key];const m={},cs=curSeason();
  for(const p of D.players){if(p.b!==b)continue;for(const r of p.g){if(isDNP(r)||D.games[r[0]][1]!==cs)continue;const k=r[2]+'|'+r[0];(m[k]||(m[k]={o:r[2],g:r[0],home:r[3]===0,rows:[]})).rows.push(r)}}
  return DEFC[key]=Object.values(m)}
function defSplit(o,b,fn){
  const g={};for(const k of sitKeys())g[k]=[];
  for(const x of defGames(b)){if(x.o!==o)continue;const tot=x.rows.reduce((a,r)=>a+fn(r),0);g.all.push(tot);g[x.home?'home':'away'].push(tot);const rb=cfg().restB(restOf(o,x.g));if(rb)g[rb].push(tot)}
  const out={};for(const k in g)out[k]={avg:mean(g[k]),n:g[k].length};return out}
const leagueAllowed=(b,fn)=>mean(defGames(b).map(x=>x.rows.reduce((a,r)=>a+fn(r),0)));
function nextCtx(){const ng=nextGame(P.t);if(!ng)return null;const home=ng[1]===P.t,opp=home?ng[2]:ng[1];
  return {ng,home,opp,rb:cfg().restB(restFor(P.t,ng)),orb:cfg().restB(restFor(opp,ng))}}

function flagTip(flag,i,isOwn){const t_=flagTip0(flag,i,isOwn);return t_?T(flag[0].toUpperCase()+flag.slice(1)+': '+i.n,t_):''}
function flagTip0(flag,i,isOwn){
  const s=(i.s||'').toLowerCase(),pos=cfg().posName[P.b]||'players';
  if(isOwn){
    if(flag==='same position')return `${i.n} plays his position and is ${s}. If he sits, more minutes, shots or touches could flow to ${P.n}.`;
    if(flag==='O-line')return `${i.n} is an offensive lineman (${s}). Missing linemen can mean more pressure on the QB and less room to run.`;
    if(flag==='his QB')return `${i.n} is his quarterback (${s}). A backup QB can change how often, and how well, ${P.n} gets the ball.`;
  }else{
    if(flag==='same position')return `${i.n} is one of their ${pos} (${s}). Thinner depth at the spot ${P.n} usually faces can soften the matchup.`;
    if(flag==='coverage')return `${i.n} (${i.p}) is ${s}. Missing pass defenders can make it easier to get open.`;
    if(flag==='run defense')return `${i.n} (${i.p}) is ${s}. Missing front-seven players can open running lanes.`;
    if(flag==='defense')return `${i.n} (${i.p}) is ${s}. Defensive absences can make them easier to move the ball on.`;
  }
  return '';
}

    h+=sitKeys().map(k=>row(ds,k,olab,oNow(k),(x,d)=>k==='all'?T(`${o.n} vs ${pos}`,[`${label} allowed`,f1(x.avg),'b'],['League average',f1(la)],['Difference',pctS(x.avg/la),(x.avg>=la)!==lw?'up':'dn'],['Games',x.n]):T(`${nick(o)} ${olab[k].toLowerCase()}`,[`${label} allowed`,f1(x.avg),'b'],['vs their usual',sgn(d),Math.abs(d)<.05?'':(d>0)!==lw?'up':'dn'],['Games',x.n],'~Green means more allowed, which helps him.',x.n<4?'~Small sample.':null))).join('');

function project(sd,nc){
  const fn=sd[2],c=cfg(),cs=curSeason(),pr=played(P.g);
  const cur=pr.filter(r=>D.games[r[0]][1]===cs),last=pr.filter(r=>D.games[r[0]][1]===cs-1),rec=pr.slice(-c.projN);
  const comps=[];
  if(rec.length>=3)comps.push([`last ${rec.length}`,mean(rec.map(fn)),.45]);
  if(cur.length>=3)comps.push(['this season',mean(cur.map(fn)),.35]);
  if(last.length>=6)comps.push([c.seasonLbl(cs-1),mean(last.map(fn)),.2]);
  if(!comps.length)return null;
  const ws=comps.reduce((a,x)=>a+x[2],0),base=comps.reduce((a,x)=>a+x[1]*x[2],0)/ws;
  let f=1;const adj=[],win=playerWin(),me=splitOf(win,fn,r=>r[1]),all=me.all.avg,o=D.teams[nc.opp];
  if(P.b){const ds=defSplit(nc.opp,P.b,fn),la=leagueAllowed(P.b,fn);
    if(ds.all.n>=4&&la>0){const m=clamp(1+.5*(ds.all.avg/la-1),.85,1.15);f*=m;adj.push(['Matchup',pctS(m),m>=1?'up':'dn',`the ${nick(o)} allow ${f1(ds.all.avg)} per game to ${c.posName[P.b]} vs a ${f1(la)} league average.`])}
    if(nc.orb&&ds[nc.orb].n>=3&&ds.all.avg>0){const m=clamp(1+.5*(ds[nc.orb].avg/ds.all.avg-1),.94,1.06);if(Math.abs(m-1)>.004){f*=m;adj.push([`Their rest (${c.restLbl[nc.orb].toLowerCase()})`,pctS(m),m>=1?'up':'dn',`they allow ${f1(ds[nc.orb].avg)} in that spot vs ${f1(ds.all.avg)} normally.`])}}}
  const lk=nc.home?'home':'away';
  if(me[lk].n>=5&&all>0){const m=clamp(1+.5*(me[lk].avg/all-1),.94,1.06);if(Math.abs(m-1)>.004){f*=m;adj.push([nc.home?'Home game':'Road game',pctS(m),m>=1?'up':'dn',`he averages ${f1(me[lk].avg)} ${nc.home?'at home':'on the road'} vs ${f1(all)} overall.`])}}
  if(nc.rb&&me[nc.rb].n>=4&&all>0){const m=clamp(1+.5*(me[nc.rb].avg/all-1),.94,1.06);if(Math.abs(m-1)>.004){f*=m;adj.push([c.restLbl[nc.rb],pctS(m),m>=1?'up':'dn',`he averages ${f1(me[nc.rb].avg)} in that spot.`])}}
  const proj=base*f,w=win.slice(-30),mu=mean(w.map(fn));
  const rs=mu>0?w.map(r=>fn(r)/mu).sort((a,b)=>a-b):[];
  const q=p=>rs.length?rs[Math.round(p*(rs.length-1))]:1;
  return {comps,base,adj,proj,floor:proj*q(.2),up:proj*q(.8),n:w.length,rec:mean(rec.map(fn))};
}
function renderProj(){
  const nc=nextCtx(),box=$('projBox');
  if(!nc||!played(P.g).length){box.hidden=true;return}box.hidden=false;
  const c=cfg(),pc=posCfg(),o=D.teams[nc.opp];
  const keys=[...new Set([st.stat,...pc.tiles])].filter(k=>pc.stats.some(s=>s[0]===k)).slice(0,6);
  const rows=keys.map(k=>{const sd=pc.stats.find(s=>s[0]===k);return [sd,project(sd,nc)]}).filter(x=>x[1]);
  if(!rows.length){box.hidden=true;return}
  const notes=[],mi=N?myInjury():null;
  if(mi)notes.push(`He's listed <b>${esc(mi.s.toLowerCase())}</b>${mi.w?' ('+esc(mi.w)+')':''}. These numbers assume he plays his normal role.`);
  const own=injFor(P.t);
  if(own){const outs=own.filter(i=>/^out|reserve|doubt/i.test(i.s)&&cfg().ownFlag(i.p,P)&&norm(i.n)!==norm(P.n));
    if(outs.length)notes.push(`${outs.slice(0,3).map(i=>esc(i.n)).join(', ')}${outs.length>3?` and ${outs.length-3} more`:''} ${outs.length>1?'are':'is'} out or doubtful (flagged in the injury report). That can push extra volume his way, which isn't built into these numbers.`)}
  let h=`<div class="phead"><h2>Projection vs the ${esc(nick(o))}</h2><span class="sub2">${nc.home?'Home':'Away'} · ${esc(new Date(nc.ng[0]).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}))}</span></div>
  <p class="sub">Blends his recent form and season averages, then adjusts for the matchup, home or away and rest. Floor and upside are his typical off and good nights (20th and 80th percentile). Hover a row to see how it was built.</p>`;
  if(notes.length)h+=`<p class="pnote">${notes.join(' ')}</p>`;
  h+=`<div class="prow phd"><span></span><span>Floor</span><span>Standard</span><span>Upside</span><span class="pbar"></span></div>`;
  h+=rows.map(([sd,p],i)=>{
    const tip=T(`${sd[1]}: how we got ${f1(p.proj)}`,...p.comps.map(x=>[x[0][0].toUpperCase()+x[0].slice(1),f1(x[1])]),['Starting point',f1(p.base),'b'],...(p.adj.length?p.adj.flatMap(a=>[[a[0],a[1],a[2]],'~'+a[3]]):['~No matchup or situation adjustments (not enough games to trust them).']),['Floor · standard · upside',`${f1(p.floor)} · ${f1(p.proj)} · ${f1(p.up)}`,'b'],`~Floor and upside come from his last ${p.n} games.`);
    const mx=Math.max(p.up,p.rec,p.proj)*1.15||1,X=x=>(clamp(x/mx,0,1)*100).toFixed(1)+'%';

  const all=gs;const base=k=>mean(all.map(x=>x.a[C[k]-7]));
  const rows=defs.map(([lbl,f,now])=>{const xs=gs.filter(f);if(!xs.length)return '';const pf=mean(xs.map(x=>x.pf)),pa=mean(xs.map(x=>x.pa));
    return `<tr class="${now?'now':''}" tabindex="0" data-tip="${esc(T(`${D.teams[t].a}: ${lbl.toLowerCase()}`,['Points scored',f1(pf)],['Points allowed',f1(pa)],...ks.map(k=>[`${statName(k)} allowed`,f1(mean(xs.map(x=>x.a[C[k]-7]))),mean(xs.map(x=>x.a[C[k]-7]))>=base(k)?'up':'dn']),['Games',xs.length],xs.length<4?'~Small sample.':'~Since '+c.seasonLbl(cs-1)+'. Green allowed = softer than their norm.'))}"><td>${esc(lbl)}${now?'<span class="nowtag">this game</span>':''}</td><td>${f1(pf)}</td><td>${f1(pa)}</td>${ks.map(k=>`<td>${f1(mean(xs.map(x=>x.a[C[k]-7])))}</td>`).join('')}<td>${xs.length}</td></tr>`}).join('');
  return `<table class="sp">${head}${rows}</table>`;
}
function volume(t){const s=teamSummary(t);if(!s)return '';
  const items=L==='nba'?[['Points',s.pf],['FGA',s.f('FGA')],['3PA',s.f('3PA')],['3PM',s.f('3PM')],['FTA',s.f('FTA')],['Assists',s.f('AST')],['Rebounds',s.f('REB')]]
    :(()=>{const att=s.f('ATT'),car=s.f('CAR');return [['Points',s.pf],['Pass att',att],['Pass yds',s.f('PYD')],['Rush att',car],['Rush yds',s.f('RYD')],['Pass rate',att+car?att/(att+car)*100:NaN,'%']]})();
  return `<div class="vol">${items.map(([k,x,u])=>`<div><b>${f1(x)}${u||''}</b><small>${esc(k)}</small></div>`).join('')}</div>`}
function allowVol(t){const s=teamSummary(t);if(!s)return '';
  const items=L==='nba'?[['Points',s.pa],['Opp FG att',s.a('FGA')],['Opp 3PM',s.a('3PM')],['Opp FTA',s.a('FTA')]]
    :[['Points',s.pa],['Pass yds',s.a('PYD')],['Pass TD',s.a('PTD')],['Rush yds',s.a('RYD')],['Sacks',s.a('SK')],['INTs',s.a('INT')]];
  return `<div class="vol">${items.map(([k,x])=>`<div><b>${f1(x)}</b><small>${esc(k)}</small></div>`).join('')}</div>`}
function renderGame(gi){
  const g=D.sched[gi];
  if(!g){$('gameView').innerHTML=`<div class="hwrap"><section class="blk"><h2>Game not found</h2><p class="sub">It may have already been played. <a href="#home-${L}">Back to the slate</a></p></section></div>`;return}
  const h=g[1],a=g[2],th=D.teams[h],ta=D.teams[a],c=cfg();setTheme(th.c);document.documentElement.style.setProperty('--oc','#'+ta.c);
  const wx=L==='nfl'&&N&&N.nfl&&N.nfl.wx?N.nfl.wx[`${ta.a}@${th.a}`]:null;
  const venue=L==='nfl'?[(wx&&wx.v)||g[4]||'',g[3]==='d'||(wx&&wx.in)?'Dome / closed roof':wx&&wx.t!=null?`${Math.round(wx.t)}°F${wx.d?', '+wx.d:''}`:g[3]==='o'?'Outdoors · forecast not posted yet':''].filter(Boolean).join(' · '):'';
  const rest=t=>{const d=restFor(t,g);if(d==null||d<0)return '';const[x,hot]=c.rest(d);return `<span class="${hot?'hot':''}">${esc(D.teams[t].a)}: ${esc(x.toLowerCase())}</span>`};
  const panel=t=>{const tm=D.teams[t],s=teamSummary(t);return `<section class="blk tpanel rv"><h2>${teamLink(t,`${logoImg(tm)}${esc(tm.n)}`)}</h2><p class="sub">${esc(record(t))}${s?` · last 5: ${esc(s.last5)}`:''}</p>
    <h3>What they give up by position</h3>${defenseSummary(t)}
    <h3>By situation</h3><p class="sub">Since ${esc(c.seasonLbl(curSeason()-1))}. Highlighted rows apply to this game.</p><div class="scroll">${condRows(t,g)}</div>
    <h3>Key players</h3><div class="roster">${rosterRows(t,L==='nba'?8:10)}</div>
    <div class="card2">${injCard(t,false)}</div></section>`};
  $('gameView').innerHTML=`<div class="band mast gmast"><div class="wrap"><div class="face big">${teamLink(a,`<div>${logoImg(ta)}<div class="lbl">${esc(ta.n)}</div><small>${esc(record(a))}</small></div>`)}<div class="vsx">@</div>${teamLink(h,`<div>${logoImg(th)}<div class="lbl">${esc(th.n)}</div><small>${esc(record(h))}</small></div>`)}</div>
    <div class="when">${esc(fmtDay(g[0]))} · ${esc(fmtTime(g[0]))}${venue?' · '+esc(venue):''}</div><div class="ctx">${rest(a)}${rest(h)}</div></div></div>
  <div class="gcols"><section class="blk rv tapebox" style="--ac:#${esc(ta.c)};--hc:#${esc(th.c)}">${tape(a,h)}</section>${panel(a)}${panel(h)}</div>`;
}
function tape(a,h){
  const sa=teamSummary(a),sh=teamSummary(h);if(!sa||!sh)return '<p class="quiet">Not enough games yet.</p>';
  // lower: 1 = lower is better, 2 = style only (no better side)
  const M=L==='nba'?[['Points scored',s=>s.pf],['Points allowed',s=>s.pa,1],['Field goal att',s=>s.f('FGA')],['3-pointers made',s=>s.f('3PM')],['3-point att',s=>s.f('3PA'),2],['Free throw att',s=>s.f('FTA')],['Assists',s=>s.f('AST')],['Rebounds',s=>s.f('REB')],['Opp 3PM allowed',s=>s.a('3PM'),1],['Turnovers',s=>s.f('TO'),1]]
    :[['Points scored',s=>s.pf],['Points allowed',s=>s.pa,1],['Pass attempts',s=>s.f('ATT'),2],['Pass yards',s=>s.f('PYD')],['Rush attempts',s=>s.f('CAR'),2],['Rush yards',s=>s.f('RYD')],['Pass rate %',s=>{const x=s.f('ATT'),y=s.f('CAR');return x+y?x/(x+y)*100:NaN},2],['Pass yds allowed',s=>s.a('PYD'),1],['Rush yds allowed',s=>s.a('RYD'),1],['Sacks made',s=>s.a('SK')],['Interceptions',s=>s.a('INT')]];
  const all=D.teams.map((_,t)=>teamSummary(t)),NT=all.filter(Boolean).length;
  const side=(t,val,lgVals,lower,lgAvg,isLeft)=>{
    const sorted=[...lgVals].sort((p,q)=>lower===1?p-q:q-p),rk=sorted.findIndex(x=>x===val)+1,pct=NT>1?(NT-rk)/(NT-1):.5;
    const tier=lower===2?'mut':rk<=NT/3?'good':rk>2*NT/3?'bad':'mut',d=val-lgAvg;
    const lbl=lower===2?`${ord(rk)}<span class="hm"> most</span>`:`${ord(rk)}`;
    const tip=T(`${D.teams[t].n}`,['Value',f1(val),'b'],['League average',f1(lgAvg)],['Rank',lower===2?`${ord(rk)} highest of ${NT}`:`${ord(rk)} best of ${NT}`,tier==='good'?'up':tier==='bad'?'dn':''],lower===2?'~Style, not good or bad.':null);
    const meter=lower===2?'<span class="tm none"></span>':`<span class="tm ${tier}"><i style="width:${Math.round(pct*100)}%"></i></span>`;
    const txt=`<span class="trk ${tier}">${lbl}</span><span class="tdv">${d>=0?'+':''}${f1(d)} vs avg</span>`;
    return `<span class="tctx ${isLeft?'l':'r'}" tabindex="0" data-tip="${esc(tip)}">${isLeft?meter+txt:txt+meter}</span>`};
  const rows=M.map(([lbl,f,lower])=>{const x=f(sa),y=f(sh),vals=all.filter(Boolean).map(f).filter(Number.isFinite),avg=mean(vals);
    const aw=lower===2?false:lower?x<y:x>y,hw=lower===2?false:lower?y<x:y>x;
    return `<div class="tape-row">${side(a,x,vals,lower,avg,true)}<span class="tv l ${aw?'win':''}">${f1(x)}</span><span class="tl">${esc(lbl)}</span><span class="tv r ${hw?'win':''}">${f1(y)}</span>${side(h,y,vals,lower,avg,false)}</div>`}).join('');
  return `<h2>Tale of the tape</h2><p class="sub">Per game this season. The bold number wins the row. Beside each number: where that team ranks in the league (green = top third, red = bottom third) and how far it is from the league average. Rows like pass rate just describe style.</p><div class="tape"><div class="tape-h"><span>${esc(D.teams[a].a)}${logoImg(D.teams[a])}</span><span class="tvs">@</span><span>${logoImg(D.teams[h])}${esc(D.teams[h].a)}</span></div>${rows}</div>`;
}

// ---------------- start
fetch('news.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null).then(n=>{N=n||{updated:null};if(!D)return;
  if(VIEW==='player'&&P)renderContext();else if(VIEW==='home'){renderHome();reveal($('homeView'))}else route()});
route();
}
</script>
