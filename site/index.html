<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Game Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical box-score desk, numbers first, no odds, no hype.
   IDEA: a printed scouting card — team-colour masthead with the matchup ticket, over agate game logs.
   PICTURE: the masthead matchup (team marks facing off) and the game-by-game bar strip.
   COLOUR and TYPE: white sheet / night court; the player's team colour leads, ink support, court orange as the one accent; Barlow Condensed figures + Barlow text.
   LAYOUT: search bar, slim masthead with averages, then two columns: stats + matchup on the left, matchup ticket, injuries and news in a sticky right rail. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1115);--ink:light-dark(#14161a,#eceef2);--mut:light-dark(#646a73,#9aa1ab);--line:light-dark(#e3e5e9,#262a31);--soft:light-dark(#f4f5f7,#171a20);--card:light-dark(#fff,#14171d);--acc:#f26b1d;--good:light-dark(#1a7f37,#4ac26b);--warn:light-dark(#b26a00,#f0b429);--bad:light-dark(#c62828,#ff6b6b);--tc:#1d428a;--oc:#555;--tcb:light-dark(var(--tc),color-mix(in oklab,var(--tc) 50%,white));--tink:#fff;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(18px,3vw,36px) max(5vw,16px)}
.wrap{max-width:1440px;margin:0 auto}
h1,h2,h3,.big,.chip,.num{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif}
svg{font-family:Barlow,system-ui,sans-serif}
a{color:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:12px}
.top .wrap{max-width:1440px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lg{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:999px;border:1px solid var(--line)}
.lg .chip{min-height:40px;padding:0 16px;font-size:18px;border:0;background:transparent}
.lg .chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.srch{position:relative;flex:1 1 180px;max-width:560px}
.srch input{width:100%;font:16px Barlow,sans-serif;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);min-height:46px;transition:border-color .2s,box-shadow .2s}
.srch svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--mut)}
.srch input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in oklab,var(--acc) 20%,transparent)}
.dd{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgb(0 0 0/.2);max-height:380px;overflow:auto;opacity:0;translate:0 -6px;pointer-events:none;transition:opacity .16s,translate .16s var(--ease)}
.dd.on{opacity:1;translate:0 0;pointer-events:auto}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;min-height:48px;border:0;background:none;color:var(--ink);font:15px Barlow,sans-serif;cursor:pointer}
.dd button:hover,.dd button.hl{background:var(--soft)}
.dd .nm{flex:1}.dd small{color:var(--mut)}
.dd img{width:26px;height:26px;object-fit:contain}
.thru{color:var(--mut);font-size:13px}
/* masthead */
.mast{position:relative;overflow:hidden;color:var(--tink);background:linear-gradient(120deg,var(--tc) 0%,color-mix(in oklab,var(--tc) 72%,black) 62%,color-mix(in oklab,var(--oc) 55%,black) 100%);transition:background .5s}
.mast .wm{position:absolute;right:-60px;top:50%;translate:0 -50%;width:min(520px,70vw);opacity:.1;pointer-events:none;filter:grayscale(.2)}
.mast{padding-block:clamp(16px,2.4vw,28px)}
.mast .wrap{position:relative;max-width:1440px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:16px 28px;align-items:center}
.who{display:flex;gap:18px;align-items:center}
.mono{flex:none;width:clamp(76px,10vw,104px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.12);border:3px solid rgb(255 255 255/.55);box-shadow:inset 0 -10px 24px rgb(0 0 0/.2);font:800 clamp(32px,4.5vw,46px)/1 "Barlow Condensed",sans-serif;letter-spacing:-.01em}
h1{font-size:clamp(32px,4.4vw,48px);line-height:1.02;margin:0;font-weight:700;text-wrap:balance}
.meta{opacity:.85;margin-top:4px}
.stat-pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px;background:#fff;color:#111}
.stat-pill i{width:8px;height:8px;border-radius:50%;background:var(--sc,#999)}
.ticket{color:var(--tink);background:linear-gradient(135deg,var(--tc),color-mix(in oklab,var(--tc) 55%,black) 60%,color-mix(in oklab,var(--oc) 70%,black));border-radius:16px;padding:16px 18px;box-shadow:0 10px 28px rgb(0 0 0/.18)}
.face{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.face img{width:clamp(54px,7vw,76px);height:clamp(54px,7vw,76px);object-fit:contain;filter:drop-shadow(0 6px 10px rgb(0 0 0/.3))}
.face .lbl{font:700 18px "Barlow Condensed",sans-serif;margin-top:2px}
.face .vsx{font:800 22px "Barlow Condensed",sans-serif;opacity:.75}
.logo-fb{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgb(255 255 255/.15);font:800 22px "Barlow Condensed",sans-serif}
.when{text-align:center;margin-top:8px;font-weight:500}
.ctx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.ctx span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgb(255 255 255/.16)}
.ctx span.hot{background:#fff;color:#111}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{background:rgb(255 255 255/.1);border-radius:10px;padding:8px 10px}
.tile .big{font-size:30px;line-height:1;font-weight:700}
.tile small{display:block;opacity:.8;font-size:13px}
/* two-column layout */
.layout{max-width:1440px;margin:0 auto;padding:clamp(16px,2.4vw,28px) max(4vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:24px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:24px}
.col-side{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.2vw,26px)}
.match{background:var(--soft)}
.match .head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.match .head h2{display:flex;align-items:center;gap:10px}
.match .head h2 img{width:40px;height:40px;object-fit:contain}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 8px}
.card h3{display:flex;align-items:center;gap:8px;font-size:20px;margin:0 0 6px}
.card h3 img{width:24px;height:24px;object-fit:contain}
.card h3 small{margin-left:auto;font:500 13px Barlow,sans-serif;color:var(--mut)}
.inj{list-style:none;margin:0;padding:0}
.inj li{border-top:1px solid var(--line)}
.inj details{padding:8px 0}
.inj summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none}
.inj summary::-webkit-details-marker{display:none}
.inj .n{font-weight:600}.inj .p{color:var(--mut);font-size:13px}
.inj .s{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--sc)}
.inj .w{display:block;color:var(--mut);font-size:13px}
.inj .c{font-size:14px;margin:6px 0 2px;color:var(--ink)}
.inj .flag{font-size:11px;font-weight:700;color:var(--acc);margin-left:4px}
.inj li.me{background:color-mix(in oklab,var(--acc) 10%,transparent);border-radius:8px;padding-inline:6px}
.more{border:0;background:none;color:var(--acc);font:600 14px Barlow,sans-serif;padding:8px 0;cursor:pointer;min-height:40px}
.news{list-style:none;margin:0;padding:0}
.news li{border-top:1px solid var(--line);padding:9px 0}
.news a{font-weight:600;text-decoration:none;line-height:1.3;display:block}
.news a:hover{text-decoration:underline;text-decoration-color:var(--acc)}
.news small{color:var(--mut);font-size:13px}
.news .tg{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--soft);border:1px solid var(--line);margin-right:6px;color:var(--ink)}
.news .tg.me{background:var(--acc);border-color:var(--acc);color:#fff}
.quiet{color:var(--mut);font-size:14px;padding:6px 0 10px;margin:0}
/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp>span{font-size:13px;color:var(--mut);margin-right:4px}
.chip{font-size:15px;font-weight:600;flex:none;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;cursor:pointer;transition:background .18s,color .18s,border-color .18s,scale .12s}
.chip:hover{border-color:var(--mut)}
.chip:active{scale:.95}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.more:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mark input,select{font:16px Barlow,sans-serif;min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.mark input{width:90px}
h2{font-size:32px;line-height:1.05;margin:0 0 4px;font-weight:700}
h3{font-size:24px;line-height:1.1;margin:0;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px}
.sum{display:flex;flex-wrap:wrap;gap:8px 22px;margin:4px 0 10px;align-items:baseline}
.sum .big{font-size:42px;font-weight:700;line-height:1}
.sum .hit{color:var(--acc);font-weight:600}
.fig{position:relative;min-height:300px;border-bottom:1px solid var(--line)}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{transform-box:fill-box;transform-origin:bottom;transition:opacity .2s}
.fig svg g:hover .bar{opacity:.78}
.avgs{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.avgs div{flex:1 1 84px;background:var(--card);padding:9px 11px}
.avgs .big{font-size:25px;font-weight:600;line-height:1.1;display:block}
.avgs small{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mut);font-size:13px;background:var(--bg)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--soft)}
td.hl{font-weight:700}
tr.dnp td{color:var(--mut)}
.tag{font-size:11px;font-weight:600;color:var(--acc);margin-left:4px}
.W{color:var(--good)}.L{color:var(--bad)}
/* projection */
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.sub2{color:var(--mut);font-weight:600}
.pnote{background:color-mix(in oklab,var(--acc) 10%,transparent);border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px;font-size:14px;margin:0 0 12px}
.prow{display:grid;grid-template-columns:76px 64px 84px 64px minmax(0,1fr);gap:12px;align-items:center;padding:8px 8px;border-top:1px solid var(--line);border-radius:8px;cursor:help;transition:background .15s}
.prow:hover,.prow:focus-visible{background:var(--soft);outline:none}
.prow.cur .pk{color:var(--acc)}
.prow.phd{border-top:0;font-size:12px;color:var(--mut);cursor:default;padding-block:0 4px}.prow.phd:hover{background:none}
.prow.phd span{text-align:right}.prow.phd span:first-child{text-align:left}
.prow .num{font:600 20px/1 "Barlow Condensed",sans-serif;text-align:right}
.prow .ps{font-size:27px;font-weight:800}
.prow .pf,.prow .pu{color:var(--mut)}
.pk{font:700 17px "Barlow Condensed",sans-serif}
.pbar{display:block;position:relative;height:14px}
.pbar i{display:block}.pbar .rng{position:absolute;top:3px;height:8px;border-radius:4px;background:color-mix(in oklab,var(--tcb) 35%,transparent);transform-origin:left}
.pbar .dot{position:absolute;top:-1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--tcb);border:3px solid var(--card)}
.pbar .avg{position:absolute;top:-2px;width:2px;height:18px;margin-left:-1px;background:var(--ink);opacity:.45}
.fine{font-size:13px;color:var(--mut);margin:10px 0 0}
/* splits */
.splits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.splits h3{font-size:20px;margin:0 0 6px}
.sp th,.sp td{text-align:right}.sp th:first-child,.sp td:first-child{text-align:left}
.sp tr.now{background:color-mix(in oklab,var(--acc) 11%,transparent)}
.sp tr[data-tip]{cursor:help}
.nowtag{font-size:11px;font-weight:700;color:var(--acc);margin-left:4px}
.sp tr.lgavg td{color:var(--mut)}
/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:200;width:max-content;min-width:210px;max-width:min(320px,calc(100vw - 24px));background:color-mix(in oklab,var(--card) 94%,transparent);backdrop-filter:blur(10px);color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--tcb);border-radius:12px;padding:10px 12px 9px;font:14px/1.4 Barlow,system-ui,sans-serif;pointer-events:none;opacity:0;translate:0 6px;scale:.97;transform-origin:50% 100%;transition:opacity .16s,translate .2s var(--ease),scale .2s var(--ease);box-shadow:0 18px 44px rgb(0 0 0/.22)}
.tip.on{opacity:1;translate:0 0;scale:1}
.tip .tt{display:block;font:700 17px/1.15 "Barlow Condensed",Barlow,sans-serif;margin-bottom:5px}
.tip .tr{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:4px 0;border-top:1px solid var(--line)}
.tip .tr span{color:var(--mut)}
.tip .tr b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tip .tr.up b{color:var(--good)}.tip .tr.dn b{color:var(--bad)}.tip .tr.b b{font-weight:800;font-size:15px}
.tip .tn{display:block;color:var(--mut);font-size:13px;line-height:1.4;margin-top:6px}
.tip .tp{display:block;line-height:1.45}
.lgd{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px}
.lgd i.up{background:var(--good)}.lgd i.dn{background:var(--bad)}.lgd i.eq{background:color-mix(in oklab,var(--mut) 50%,transparent)}
td.tc{font-weight:700}
[data-tip]{cursor:help}
.ctx span[data-tip],.inj .flag[data-tip]{text-decoration:underline dotted;text-underline-offset:3px}
.dvrow[data-tip]:hover{background:var(--soft);border-radius:8px}
/* matchup */
.dvp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.5vw,24px);margin-bottom:22px}
.dvp .verdict{display:flex;gap:10px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.pill{font:700 15px "Barlow Condensed",Barlow,sans-serif;padding:3px 10px;border-radius:999px;color:#fff}
.dvp p{margin:6px 0 14px;max-width:70ch}
.dvrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px 20px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dvrow .txt b{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:20px}
.dvrow .txt small{display:block;color:var(--mut);font-size:13px}
.track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in oklab,var(--bad) 55%,transparent),color-mix(in oklab,var(--mut) 25%,transparent),color-mix(in oklab,var(--good) 55%,transparent))}
.track i{position:absolute;left:50%;top:-5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--ink);border:3px solid var(--card);transition:left .8s var(--ease)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0 16px}
.cmp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cmp .big{font-size:28px;font-weight:700;line-height:1}
.cmp small{display:block;color:var(--mut);font-size:13px}
.up{color:var(--good)}.dn{color:var(--bad)}
.empty{padding:28px 0;color:var(--mut);text-align:center}
.foot{color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
.sk{display:inline-block;width:min(420px,70%);height:.9em;border-radius:8px;background:linear-gradient(90deg,rgb(255 255 255/.12),rgb(255 255 255/.3),rgb(255 255 255/.12));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:1080px){
  .mast .wrap{grid-template-columns:minmax(0,1fr)}
  .layout{display:flex;flex-direction:column}
  .col-main,.col-side{display:contents}
  #projBox{order:1}.stats{order:2}#ticket{order:3}#injOwn{order:4}#injOpp{order:5}#newsCard{order:6}#splitBox{order:7}.match{order:8}
  .layout>*,.col-main>*,.col-side>*{width:100%}
}
@media(min-width:700px) and (max-width:1080px){.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#ticket,.stats,.match,#newsCard,#projBox,#splitBox{grid-column:1/-1}}
@media(max-width:760px){.tile .big{font-size:24px}.splits{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.blk{border-radius:14px;padding:14px}#statGrp{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-14px;padding-inline:14px}table{font-size:13px}.fig{min-height:240px}.tile{padding:6px}.tile small{font-size:12px}.dvrow{grid-template-columns:minmax(0,1fr)}.prow{grid-template-columns:62px repeat(3,minmax(0,1fr));gap:8px}.prow .pbar{grid-column:1/-1}.prow.phd .pbar{display:none}.who{gap:12px}.top .thru{display:none}.lg .chip{padding:0 12px;font-size:16px}}
@media(prefers-reduced-motion:no-preference){
  .in{animation:up .5s var(--ease) both}
  .in2{animation:up .5s .08s var(--ease) both}.in3{animation:up .5s .16s var(--ease) both}
  @keyframes up{from{opacity:0;translate:0 14px}}
  .bar{animation:grow .55s var(--ease) both;animation-delay:calc(var(--i,0)*18ms)}
  @keyframes grow{from{transform:scaleY(0)}}
  .bv{animation:fade .4s both;animation-delay:calc(var(--i,0)*18ms + .3s)}
  @keyframes fade{from{opacity:0}}
  .face img,.face .logo-fb{animation:pop .6s var(--ease) both}.face>div:last-child img,.face>div:last-child .logo-fb{animation-delay:.12s}
  @keyframes pop{from{opacity:0;scale:.6}}
  .face .vsx{animation:fade .6s .25s both}
  .mono{animation:pop .5s var(--ease) both}
  .prow .rng{animation:wipe .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}@keyframes wipe{from{transform:scaleX(0)}}
  .prow .dot{animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + .3s)}
}
@media(prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="lg" id="lgGrp" role="group" aria-label="League">
    <button class="chip" data-v="nba" aria-pressed="false">NBA</button>
    <button class="chip" data-v="nfl" aria-pressed="false">NFL</button>
  </div>
  <div class="srch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search any player…" autocomplete="off" aria-label="Search players" aria-controls="dd">
    <div class="dd" id="dd" role="listbox"></div>
  </div>
  <span class="thru" id="thru">Loading…</span>
</div></div>

<div class="band mast" id="mast">
  <img class="wm" id="wm" alt="" hidden>
  <div class="wrap" id="whoBox">
    <div class="who">
      <div class="mono" id="mono"></div>
      <div>
        <h1 id="pname"><span class="sk"></span></h1>
        <div class="meta" id="pmeta"></div>
        <div id="pstat"></div>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>
</div>

<div class="layout">
  <main class="col-main">
    <section class="blk proj" id="projBox" hidden></section>
    <section class="blk stats" id="recBox">
      <div class="ctl"><div class="grp" id="statGrp" aria-label="Stat"></div></div>
      <div class="ctl">
        <div class="grp" id="rangeGrp"></div>
        <div class="grp" id="locGrp"></div>
        <label class="grp mark"><span>Mark a number</span><input id="mark" type="number" step="0.5" inputmode="decimal" placeholder="optional"></label>
      </div>
      <h2 id="recTitle">Recent games</h2>
      <div class="sum" id="recSum"></div>
      <div class="fig"><svg id="recSvg" role="img" aria-label="Game by game chart"></svg></div>
      <div class="avgs" id="recAvg"></div>
      <div class="scroll"><table id="recTbl"></table></div>
    </section>
    <section class="blk" id="splitBox"></section>
    <section class="blk match">
      <div class="head">
        <div><h2 id="vsTitle">Matchup</h2><p class="sub" id="vsSub"></p></div>
        <label class="grp"><span>Opponent</span><select id="opp" aria-label="Opponent"></select></label>
      </div>
      <div class="dvp" id="dvp"></div>
      <h3 id="histTitle">His games against them</h3>
      <p class="sub" id="histSub"></p>
      <div class="cmp" id="vsCmp"></div>
      <div class="fig" id="vsFig"><svg id="vsSvg" role="img" aria-label="Games against opponent chart"></svg></div>
      <div class="scroll" style="margin-top:14px"><table id="vsTbl"></table></div>
    </section>
  </main>
  <aside class="col-side" id="side">
    <div class="ticket" id="ticket" hidden></div>
    <div class="card" id="injOwn"></div>
    <div class="card" id="injOpp" hidden></div>
    <div class="card" id="newsCard"></div>
  </aside>
</div>

<div class="band foot"><div class="wrap" id="foot"></div></div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const f1=v=>Number.isFinite(v)?(Math.round(v*10)/10).toFixed(1):'–';
const fv=v=>Number.isInteger(v)?String(v):(Math.round(v*10)/10).toFixed(1);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const median=a=>{if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),h=(b.length-1)/2;return (b[Math.floor(h)]+b[Math.ceil(h)])/2};
const pct=(m,a)=>a?(Math.round(m/a*1000)/10)+'%':'–';
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const lum=h=>{const n=parseInt(h,16),f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,'').replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/\s+/g,' ').trim();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ago=iso=>{const m=(Date.now()-Date.parse(iso))/6e4;if(!Number.isFinite(m))return '';if(m<60)return Math.max(1,Math.round(m))+'m ago';if(m<1440)return Math.round(m/60)+'h ago';const d=Math.round(m/1440);return d===1?'yesterday':d+'d ago'};
const etDate=iso=>new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const dayDiff=(a,b)=>Math.round((Date.parse(b+'T12:00Z')-Date.parse(a+'T12:00Z'))/864e5);

let D=null,C={},P=null,L='nba',N=null;const cache={};
const v=(r,k)=>r[C[k]];
const isDNP=r=>r.length<=7;
const played=rows=>rows.filter(r=>!isDNP(r));

// ---------------- league definitions
const NBA={
  name:'NBA',file:'nba.json',hours:3,ranges:[['5','L5'],['10','L10'],['15','L15'],['20','L20']],defRange:'10',defPlayer:'Shai Gilgeous-Alexander',
  seasonLbl:s=>`${s-1}-${String(s).slice(2)}`,
  thru:d=>{const[y,m,dd]=d.through.split('-');return `Box scores through ${MON[+m-1]} ${+dd}, ${y}`},
  posName:{G:'guards',F:'forwards',C:'centers'},
  dvpLbl:{PTS:'points',REB:'rebounds',AST:'assists','3PM':'threes',PRA:'points + rebounds + assists'},
  meta:p=>[p.p==='G'?'Guard':p.p==='F'?'Forward':p.p==='C'?'Center':p.p,p.j?'#'+p.j:''],
  mono:p=>p.j?'#'+p.j:p.p,
  bucket:pos=>({PG:'G',SG:'G',G:'G',SF:'F',PF:'F',F:'F',C:'C'})[pos]||null,
  pos:()=>({
    stats:[['PTS','Points',r=>v(r,'PTS')],['REB','Rebounds',r=>v(r,'REB')],['AST','Assists',r=>v(r,'AST')],['3PM','Threes made',r=>v(r,'3PM')],
      ['PRA','Pts + Reb + Ast',r=>v(r,'PTS')+v(r,'REB')+v(r,'AST')],['P+R','Pts + Reb',r=>v(r,'PTS')+v(r,'REB')],['P+A','Pts + Ast',r=>v(r,'PTS')+v(r,'AST')],['R+A','Reb + Ast',r=>v(r,'REB')+v(r,'AST')],
      ['STL','Steals',r=>v(r,'STL')],['BLK','Blocks',r=>v(r,'BLK')],['STL+BLK','Steals + Blocks',r=>v(r,'STL')+v(r,'BLK')],['TO','Turnovers',r=>v(r,'TO')],
      ['MIN','Minutes',r=>v(r,'MIN')],['FGA','Field goal attempts',r=>v(r,'FGA')],['3PA','Three attempts',r=>v(r,'3PA')],['FTA','Free throw attempts',r=>v(r,'FTA')]],
    tiles:['PTS','REB','AST','3PM','MIN'],
    table:[['MIN'],['PTS'],['REB'],['AST'],['3PM'],['STL'],['BLK'],['TO'],['FG',r=>v(r,'FGM')+'-'+v(r,'FGA')],['3P',r=>v(r,'3PM')+'-'+v(r,'3PA')],['FT',r=>v(r,'FTM')+'-'+v(r,'FTA')],['+/-',r=>(v(r,'PM')>0?'+':'')+v(r,'PM')]],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['MIN',m('MIN')],['PTS',m('PTS')],['REB',m('REB')],['AST',m('AST')],['3PM',m('3PM')],['STL',m('STL')],['BLK',m('BLK')],['TO',m('TO')],
        ['PRA',f1(mean(pr.map(r=>v(r,'PTS')+v(r,'REB')+v(r,'AST'))))],['FG%',pct(s('FGM'),s('FGA'))],['3P%',pct(s('3PM'),s('3PA'))],['FT%',pct(s('FTM'),s('FTA'))]]}
  }),
  dateLbl:(g,yr)=>{const[y,m,d]=g[0].split('-');return `${MON[+m-1]} ${+d}`+(yr?` '${y.slice(2)}`:'')},
  tag:g=>g[2]===3?'PO':g[2]===5?'PI':'',
  rest:(days)=>days<=0?['Back-to-back',true]:days===1?['1 day rest',false]:[`${days} days rest`,false],
  logo:a=>`https://a.espncdn.com/i/teamlogos/nba/500/${a.toLowerCase()}.png`,
  projN:10,restKeys:['b2b','r1','r2'],restLbl:{b2b:'Back-to-back',r1:'1 day rest',r2:'2+ days rest'},restB:d=>d==null||d<0?null:d===0?'b2b':d===1?'r1':'r2',
  // which injured players matter for this player
  oppFlag:(ip,P)=>NBA.bucket(ip)&&NBA.bucket(ip)===P.b?'same position':'',
  ownFlag:(ip,P)=>NBA.bucket(ip)&&NBA.bucket(ip)===P.b?'same position':''
};
const NFLPOS={
  QB:{stats:[['PYD','Pass yds',r=>v(r,'PYD')],['PTD','Pass TD',r=>v(r,'PTD')],['CMP','Completions',r=>v(r,'CMP')],['ATT','Pass attempts',r=>v(r,'ATT')],['INT','Interceptions',r=>v(r,'INT')],
      ['RYD','Rush yds',r=>v(r,'RYD')],['P+R YDS','Pass + rush yds',r=>v(r,'PYD')+v(r,'RYD')],['CAR','Carries',r=>v(r,'CAR')],['FPTS','Fantasy pts (PPR)',r=>v(r,'FPTS')]],
    tiles:['PYD','PTD','INT','RYD','FPTS'],
    table:[['C/A',r=>v(r,'CMP')+'/'+v(r,'ATT')],['PYD'],['PTD'],['INT'],['SK'],['CAR'],['RYD'],['RTD'],['FPTS']],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['Pass yds',m('PYD')],['Pass TD',m('PTD')],['INT',m('INT')],['Comp',m('CMP')],['Att',m('ATT')],['Comp %',pct(s('CMP'),s('ATT'))],['Yds/att',s('ATT')?f1(s('PYD')/s('ATT')):'–'],['Sacks',m('SK')],['Rush yds',m('RYD')],['Fantasy',m('FPTS')]]}},
  RB:{stats:[['RYD','Rush yds',r=>v(r,'RYD')],['CAR','Carries',r=>v(r,'CAR')],['REC','Receptions',r=>v(r,'REC')],['RECYD','Rec yds',r=>v(r,'RECYD')],
      ['R+R YDS','Rush + rec yds',r=>v(r,'RYD')+v(r,'RECYD')],['TD','Total TDs',r=>v(r,'RTD')+v(r,'RECTD')],['TGT','Targets',r=>v(r,'TGT')],['FPTS','Fantasy pts (PPR)',r=>v(r,'FPTS')]],
    tiles:['RYD','CAR','REC','RECYD','FPTS'],
    table:[['CAR'],['RYD'],['RTD'],['TGT'],['REC'],['RECYD'],['RECTD'],['FUM',r=>v(r,'FUML')],['FPTS']],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['Carries',m('CAR')],['Rush yds',m('RYD')],['Yds/carry',s('CAR')?f1(s('RYD')/s('CAR')):'–'],['Targets',m('TGT')],['Rec',m('REC')],['Rec yds',m('RECYD')],['Scrim yds',f1(mean(pr.map(r=>v(r,'RYD')+v(r,'RECYD'))))],['TDs',f1(mean(pr.map(r=>v(r,'RTD')+v(r,'RECTD'))))],['Fantasy',m('FPTS')]]}},
  WR:{stats:[['REC','Receptions',r=>v(r,'REC')],['RECYD','Rec yds',r=>v(r,'RECYD')],['TGT','Targets',r=>v(r,'TGT')],['RECTD','Rec TD',r=>v(r,'RECTD')],
      ['R+R YDS','Rush + rec yds',r=>v(r,'RYD')+v(r,'RECYD')],['FPTS','Fantasy pts (PPR)',r=>v(r,'FPTS')]],
    tiles:['REC','RECYD','TGT','RECTD','FPTS'],
    table:[['TGT'],['REC'],['RECYD'],['RECTD'],['Y/R',r=>v(r,'REC')?f1(v(r,'RECYD')/v(r,'REC')):'–'],['CAR'],['RYD'],['FPTS']],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['Targets',m('TGT')],['Rec',m('REC')],['Rec yds',m('RECYD')],['Rec TD',m('RECTD')],['Catch %',pct(s('REC'),s('TGT'))],['Yds/rec',s('REC')?f1(s('RECYD')/s('REC')):'–'],['Fantasy',m('FPTS')]]}}
};
NFLPOS.TE=NFLPOS.WR;
const NFL_WK={19:'WC',20:'DIV',21:'CON',22:'SB'};
const DEF=new Set(['CB','S','FS','SS','DB','LB','ILB','OLB','MLB','DE','DT','DL','NT','EDGE']);
const OL=new Set(['OT','T','G','OG','C','OL','LT','RT','LG','RG']);
const NFL={
  name:'NFL',file:'nfl.json',hours:4,ranges:[['3','L3'],['5','L5'],['8','L8']],defRange:'5',defPlayer:'Patrick Mahomes',
  seasonLbl:s=>String(s),
  thru:d=>`Stats through ${d.through}, ${d.season} season`,
  posName:{QB:'quarterbacks',RB:'running backs',WR:'wide receivers',TE:'tight ends'},
  dvpLbl:{PYD:'passing yards',PTD:'passing TDs',RYD:'rushing yards',REC:'receptions',RECYD:'receiving yards',RECTD:'receiving TDs',FPTS:'PPR fantasy points'},
  meta:p=>[{QB:'Quarterback',RB:'Running back',WR:'Wide receiver',TE:'Tight end'}[p.p]||p.p],
  mono:p=>p.p,
  pos:p=>NFLPOS[p.p]||NFLPOS.WR,
  dateLbl:(g,yr)=>{const[y,m,d]=g[0].split('-');return `${NFL_WK[g[3]]||'Wk '+g[3]} · ${MON[+m-1]} ${+d}`+(yr?` '${y.slice(2)}`:'')},
  tag:g=>g[2]===3?'PO':'',
  rest:(days)=>days<=3?['Short week',true]:days>=12?['Off a bye',false]:['Normal week',false],
  logo:a=>`https://a.espncdn.com/i/teamlogos/nfl/500/${({LA:'lar',WAS:'wsh'})[a]||a.toLowerCase()}.png`,
  projN:5,restKeys:['short','norm','bye'],restLbl:{short:'Short week',norm:'Normal week',bye:'Off a bye'},restB:d=>d==null||d<0?null:d<=3?'short':d>=11?'bye':'norm',
  oppFlag:(ip,P)=>{if(!DEF.has(ip))return '';if(P.p==='QB')return 'defense';if(P.p==='RB')return ['DT','DL','NT','LB','ILB','MLB','OLB','DE','EDGE'].includes(ip)?'run defense':'';return ['CB','S','FS','SS','DB','LB','ILB','OLB','MLB'].includes(ip)?'coverage':''},
  ownFlag:(ip,P)=>ip===P.p?'same position':OL.has(ip)?'O-line':(P.p!=='QB'&&ip==='QB')?'his QB':''
};
const LG={nba:NBA,nfl:NFL};
const cfg=()=>LG[L];

// ---------------- state
let st={stat:null,range:null,loc:'all',mark:null,opp:null},saved={};
try{saved=JSON.parse(localStorage.getItem('pgl2')||'{}')}catch(e){}
const save=()=>{try{saved.league=L;saved[L]={pid:P&&P.id,stat:st.stat,range:st.range,loc:st.loc};localStorage.setItem('pgl2',JSON.stringify(saved))}catch(e){}};
const curSeason=()=>D.season;
const since=()=>cfg().seasonLbl(D.games[0][1]);
const posCfg=()=>cfg().pos(P);
const statDef=()=>{const s=posCfg().stats;return s.find(x=>x[0]===st.stat)||s[0]};
const NL=()=>(N&&N[L])||{logo:{},inj:{},news:{}};
const logoUrl=t=>NL().logo[t.a]||cfg().logo(t.a);
const logoImg=(t,cls='')=>`<img class="${cls}" src="${esc(logoUrl(t))}" alt="${esc(t.n)}" loading="lazy" onerror="this.outerHTML='<span class=&quot;logo-fb&quot;>${esc(t.a)}</span>'">`;
const nick=t=>t.n.split(' ').slice(-1)[0];

function rangeRows(){
  let rows=P.g.slice();const cs=curSeason();
  if(st.loc==='home')rows=rows.filter(r=>r[3]===1);if(st.loc==='away')rows=rows.filter(r=>r[3]===0);
  if(st.range==='season')return rows.filter(r=>D.games[r[0]][1]===cs);
  if(st.range==='last')return rows.filter(r=>D.games[r[0]][1]===cs-1);
  if(st.range==='all')return rows;
  const n=+st.range,out=[];let k=0;
  for(let i=rows.length-1;i>=0&&k<n;i--){out.unshift(rows[i]);if(!isDNP(rows[i]))k++}
  return out;
}
function setChips(el,list,key,lead){
  el.innerHTML=(lead?`<span>${lead}</span>`:'')+list.map(([val,l])=>`<button class="chip" data-v="${esc(val)}" aria-pressed="${st[key]===val}">${esc(l)}</button>`).join('');
}
for(const[id,key]of[['statGrp','stat'],['rangeGrp','range'],['locGrp','loc']])
  $(id).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st[key]=b.dataset.v;save();render(true)});

function countUp(el,to){
  if(RM||!Number.isFinite(to)){el.textContent=f1(to);return}
  const t0=performance.now(),dur=650;
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-(1-p)**3;el.textContent=f1(to*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

// ---------------- tip markup + good/bad tones
const T=(title,...ls)=>[title,...ls.filter(x=>x!=null&&x!==false&&x!=='').map(l=>Array.isArray(l)?l.join('::'):l)].join('\n');
const sgn=(x,d=1)=>(x>=0?'+':'')+(d?f1(x):String(Math.round(x)));
const LOWER=new Set(['TO','INT','SK','FUML']);
function toneOf(val,ref,key){
  const lower=LOWER.has(key);
  if(st.mark!=null){const hit=val>=st.mark,good=lower?!hit:hit;return {c:good?'up':'dn',t:1}}
  if(!Number.isFinite(ref))return {c:'eq',t:0};
  let d=(val-ref)/Math.max(Math.abs(ref),1);if(lower)d=-d;
  if(Math.abs(d)<.06)return {c:'eq',t:0};
  return {c:d>0?'up':'dn',t:clamp(Math.abs(d)/.5,.35,1)};
}
const toneFill=tn=>tn.c==='eq'?'color-mix(in oklab,var(--mut) 42%,var(--card))':`color-mix(in oklab,var(--${tn.c==='up'?'good':'bad'}) ${Math.round(50+50*tn.t)}%,var(--card))`;
const toneCell=tn=>tn.c==='eq'?'':` style="background:color-mix(in oklab,var(--${tn.c==='up'?'good':'bad'}) ${Math.round(12+26*tn.t)}%,transparent)"`;
function legend(ref,what){const k=st.stat,lower=LOWER.has(k);
  if(st.mark!=null)return `<span class="lgd"><i class="up"></i>${lower?'under':'hit'} your mark of ${esc(st.mark)} <i class="dn"></i>${lower?'at or over':'missed'}</span>`;
  return `<span class="lgd"><i class="up"></i>${lower?'fewer':'better'} than ${what} (${f1(ref)}) <i class="dn"></i>${lower?'more':'worse'} <i class="eq"></i>about the same</span>`}

// ---------------- chart
function bars(svg,rows,withYear,ref){
  const draw=()=>{
    const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
    const fn=statDef()[2],pr=played(rows);
    if(!pr.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mut)" font-size="15">No games in this view</text>`;return}
    const vals=pr.map(fn),mx=Math.max(1,...vals,st.mark||0)*1.12,av=mean(vals);
    const padT=22,padB=withYear?40:28,padL=W<520?6:34,padR=6,cw=(W-padL-padR)/pr.length,bw=Math.max(2,Math.min(46,cw*.72));
    const y=val=>padT+(H-padT-padB)*(1-Math.max(0,val)/mx);
    const sd=statDef(),rf=Number.isFinite(ref)?ref:av;
    let s='';
    if(W>=520){const step=mx>250?50:mx>100?25:mx>40?10:mx>16?5:mx>6?2:1;for(let t=0;t<=mx;t+=step)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${t}</text>`}
    pr.forEach((r,i)=>{const val=fn(r),x=padL+cw*i+(cw-bw)/2,g=D.games[r[0]],o=D.teams[r[2]];
      const tn=toneOf(val,rf,sd[0]),fill=toneFill(tn),rb=cfg().restB(restOf(r[1],r[0]));
      const tip=T(`${cfg().dateLbl(g,true)} · ${r[3]?'vs':'@'} ${o.a}`,[sd[1],fv(val),tn.c==='eq'?'b':tn.c],st.mark==null?['vs '+(withYear?'his usual':'this view\'s avg'),sgn(val-rf),tn.c]:['Your mark '+st.mark,(val>=st.mark)?'Hit':'Missed',tn.c],[r[4]?'Win':'Loss',`${r[5]}-${r[6]}`],L==='nba'?['Minutes',v(r,'MIN')]:['Fantasy pts',fv(v(r,'FPTS'))],['Spot',`${r[3]?'Home':'Away'}${rb?' · '+cfg().restLbl[rb].toLowerCase():''}`]);
      s+=`<g style="--i:${i}" data-tip="${esc(tip)}">`;
      s+=`<rect class="bar" x="${x}" y="${y(val)}" width="${bw}" height="${Math.max(0,y(0)-y(val))}" rx="${Math.min(5,bw/4)}" fill="${fill}"/>`;
      if(cw>=18)s+=`<text class="bv" x="${x+bw/2}" y="${y(val)-6}" text-anchor="middle" font-size="${cw>30?13:11}" font-weight="600" fill="var(--ink)">${esc(fv(val))}</text>`;
      if(cw>=36)s+=`<text x="${x+bw/2}" y="${H-padB+15}" text-anchor="middle" font-size="11" fill="var(--mut)">${r[3]?'':'@'}${esc(o.a)}</text>`;
      if(withYear&&cw>=44)s+=`<text x="${x+bw/2}" y="${H-padB+30}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(g[0].slice(0,4))}</text>`;
      s+='</g>'});
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(av)}" y2="${y(av)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    s+=`<text x="${padL+4}" y="${y(av)-6}" font-size="12" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">avg ${f1(av)}</text>`;
    if(st.mark!=null)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(st.mark)}" y2="${y(st.mark)}" stroke="var(--acc)" stroke-width="2"/><text x="${W-padR-4}" y="${y(st.mark)-6}" text-anchor="end" font-size="12" font-weight="600" fill="var(--acc)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">${esc(st.mark)}</text>`;
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mut)"/>`;
    svg.innerHTML=s;
  };
  if(svg._ro)svg._ro.disconnect();
  let first=true;svg._ro=new ResizeObserver(()=>{if(first){first=false;return}draw()});svg._ro.observe(svg);draw();
}

// ---------------- situations: rest, home/away, splits
let TG=null;const DEFC={};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const pctS=m=>{const p=Math.round((m-1)*1000)/10;return (p>=0?'+':'')+p.toFixed(1)+'%'};
function buildTG(){TG={};const add=(t,g)=>{(TG[t]||(TG[t]=new Set())).add(g)};
  for(const p of D.players)for(const r of p.g){add(r[1],r[0]);add(r[2],r[0])}
  for(const t in TG){const arr=[...TG[t]].sort((a,b)=>a-b),m={};
    arr.forEach((g,i)=>{const pg=i?D.games[arr[i-1]]:null,cg=D.games[g];m[g]=pg&&pg[1]===cg[1]?dayDiff(pg[0],cg[0])-1:null});TG[t]=m}}
const restOf=(t,g)=>TG&&TG[t]?TG[t][g]:null;
const sitKeys=()=>['all','home','away',...cfg().restKeys];
function splitOf(rows,fn,teamOf){
  const g={};for(const k of sitKeys())g[k]=[];
  for(const r of rows){const x=fn(r);g.all.push(x);g[r[3]?'home':'away'].push(x);const rb=cfg().restB(restOf(teamOf(r),r[0]));if(rb)g[rb].push(x)}
  const o={};for(const k in g)o[k]={avg:mean(g[k]),n:g[k].length};return o}
function playerWin(){const cs=curSeason();return played(P.g).filter(r=>D.games[r[0]][1]>=cs-1)}
function defGames(b){const key=L+b;if(DEFC[key])return DEFC[key];const m={},cs=curSeason();
  for(const p of D.players){if(p.b!==b)continue;for(const r of p.g){if(isDNP(r)||D.games[r[0]][1]!==cs)continue;const k=r[2]+'|'+r[0];(m[k]||(m[k]={o:r[2],g:r[0],home:r[3]===0,rows:[]})).rows.push(r)}}
  return DEFC[key]=Object.values(m)}
function defSplit(o,b,fn){
  const g={};for(const k of sitKeys())g[k]=[];
  for(const x of defGames(b)){if(x.o!==o)continue;const tot=x.rows.reduce((a,r)=>a+fn(r),0);g.all.push(tot);g[x.home?'home':'away'].push(tot);const rb=cfg().restB(restOf(o,x.g));if(rb)g[rb].push(tot)}
  const out={};for(const k in g)out[k]={avg:mean(g[k]),n:g[k].length};return out}
const leagueAllowed=(b,fn)=>mean(defGames(b).map(x=>x.rows.reduce((a,r)=>a+fn(r),0)));
function nextCtx(){const ng=nextGame(P.t);if(!ng)return null;const home=ng[1]===P.t,opp=home?ng[2]:ng[1];
  return {ng,home,opp,rb:cfg().restB(restFor(P.t,ng)),orb:cfg().restB(restFor(opp,ng))}}

function flagTip(flag,i,isOwn){const t_=flagTip0(flag,i,isOwn);return t_?T(flag[0].toUpperCase()+flag.slice(1)+': '+i.n,t_):''}
function flagTip0(flag,i,isOwn){
  const s=(i.s||'').toLowerCase(),pos=cfg().posName[P.b]||'players';
  if(isOwn){
    if(flag==='same position')return `${i.n} plays his position and is ${s}. If he sits, more minutes, shots or touches could flow to ${P.n}.`;
    if(flag==='O-line')return `${i.n} is an offensive lineman (${s}). Missing linemen can mean more pressure on the QB and less room to run.`;
    if(flag==='his QB')return `${i.n} is his quarterback (${s}). A backup QB can change how often, and how well, ${P.n} gets the ball.`;
  }else{
    if(flag==='same position')return `${i.n} is one of their ${pos} (${s}). Thinner depth at the spot ${P.n} usually faces can soften the matchup.`;
    if(flag==='coverage')return `${i.n} (${i.p}) is ${s}. Missing pass defenders can make it easier to get open.`;
    if(flag==='run defense')return `${i.n} (${i.p}) is ${s}. Missing front-seven players can open running lanes.`;
    if(flag==='defense')return `${i.n} (${i.p}) is ${s}. Defensive absences can make them easier to move the ball on.`;
  }
  return '';
}

function project(sd,nc){
  const fn=sd[2],c=cfg(),cs=curSeason(),pr=played(P.g);
  const cur=pr.filter(r=>D.games[r[0]][1]===cs),last=pr.filter(r=>D.games[r[0]][1]===cs-1),rec=pr.slice(-c.projN);
  const comps=[];
  if(rec.length>=3)comps.push([`last ${rec.length}`,mean(rec.map(fn)),.45]);
  if(cur.length>=3)comps.push(['this season',mean(cur.map(fn)),.35]);
  if(last.length>=6)comps.push([c.seasonLbl(cs-1),mean(last.map(fn)),.2]);
  if(!comps.length)return null;
  const ws=comps.reduce((a,x)=>a+x[2],0),base=comps.reduce((a,x)=>a+x[1]*x[2],0)/ws;
  let f=1;const adj=[],win=playerWin(),me=splitOf(win,fn,r=>r[1]),all=me.all.avg,o=D.teams[nc.opp];
  if(P.b){const ds=defSplit(nc.opp,P.b,fn),la=leagueAllowed(P.b,fn);
    if(ds.all.n>=4&&la>0){const m=clamp(1+.5*(ds.all.avg/la-1),.85,1.15);f*=m;adj.push(['Matchup',pctS(m),m>=1?'up':'dn',`the ${nick(o)} allow ${f1(ds.all.avg)} per game to ${c.posName[P.b]} vs a ${f1(la)} league average.`])}
    if(nc.orb&&ds[nc.orb].n>=3&&ds.all.avg>0){const m=clamp(1+.5*(ds[nc.orb].avg/ds.all.avg-1),.94,1.06);if(Math.abs(m-1)>.004){f*=m;adj.push([`Their rest (${c.restLbl[nc.orb].toLowerCase()})`,pctS(m),m>=1?'up':'dn',`they allow ${f1(ds[nc.orb].avg)} in that spot vs ${f1(ds.all.avg)} normally.`])}}}
  const lk=nc.home?'home':'away';
  if(me[lk].n>=5&&all>0){const m=clamp(1+.5*(me[lk].avg/all-1),.94,1.06);if(Math.abs(m-1)>.004){f*=m;adj.push([nc.home?'Home game':'Road game',pctS(m),m>=1?'up':'dn',`he averages ${f1(me[lk].avg)} ${nc.home?'at home':'on the road'} vs ${f1(all)} overall.`])}}
  if(nc.rb&&me[nc.rb].n>=4&&all>0){const m=clamp(1+.5*(me[nc.rb].avg/all-1),.94,1.06);if(Math.abs(m-1)>.004){f*=m;adj.push([c.restLbl[nc.rb],pctS(m),m>=1?'up':'dn',`he averages ${f1(me[nc.rb].avg)} in that spot.`])}}
  const proj=base*f,w=win.slice(-30),mu=mean(w.map(fn));
  const rs=mu>0?w.map(r=>fn(r)/mu).sort((a,b)=>a-b):[];

  return {comps,base,adj,proj,floor:proj*q(.2),up:proj*q(.8),n:w.length,rec:mean(rec.map(fn))};
}
function renderProj(){

  const c=cfg(),pc=posCfg(),o=D.teams[nc.opp];
  const keys=[...new Set([st.stat,...pc.tiles])].filter(k=>pc.stats.some(s=>s[0]===k)).slice(0,6);
  const rows=keys.map(k=>{const sd=pc.stats.find(s=>s[0]===k);return [sd,project(sd,nc)]}).filter(x=>x[1]);
  if(!rows.length){box.hidden=true;return}
  const notes=[],mi=N?myInjury():null;
  if(mi)notes.push(`He's listed <b>${esc(mi.s.toLowerCase())}</b>${mi.w?' ('+esc(mi.w)+')':''}. These numbers assume he plays his normal role.`);
  const own=injFor(P.t);
  if(own){const outs=own.filter(i=>/^out|reserve|doubt/i.test(i.s)&&cfg().ownFlag(i.p,P)&&norm(i.n)!==norm(P.n));
    if(outs.length)notes.push(`${outs.slice(0,3).map(i=>esc(i.n)).join(', ')}${outs.length>3?` and ${outs.length-3} more`:''} ${outs.length>1?'are':'is'} out or doubtful (flagged in the injury report). That can push extra volume his way, which isn't built into these numbers.`)}
  let h=`<div class="phead"><h2>Projection vs the ${esc(nick(o))}</h2><span class="sub2">${nc.home?'Home':'Away'} · ${esc(new Date(nc.ng[0]).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}))}</span></div>
  <p class="sub">Blends his recent form and season averages, then adjusts for the matchup, home or away and rest. Floor and upside are his typical off and good nights (20th and 80th percentile). Hover a row to see how it was built.</p>`;
  if(notes.length)h+=`<p class="pnote">${notes.join(' ')}</p>`;
  h+=`<div class="prow phd"><span></span><span>Floor</span><span>Standard</span><span>Upside</span><span class="pbar"></span></div>`;
  h+=rows.map(([sd,p],i)=>{
    const tip=T(`${sd[1]}: how we got ${f1(p.proj)}`,...p.comps.map(x=>[x[0][0].toUpperCase()+x[0].slice(1),f1(x[1])]),['Starting point',f1(p.base),'b'],...(p.adj.length?p.adj.flatMap(a=>[[a[0],a[1],a[2]],'~'+a[3]]):['~No matchup or situation adjustments (not enough games to trust them).']),['Floor · standard · upside',`${f1(p.floor)} · ${f1(p.proj)} · ${f1(p.up)}`,'b'],`~Floor and upside come from his last ${p.n} games.`);
    const mx=Math.max(p.up,p.rec,p.proj)*1.15||1,X=x=>(clamp(x/mx,0,1)*100).toFixed(1)+'%';
    return `<div class="prow${sd[0]===st.stat?' cur':''}" tabindex="0" data-tip="${esc(tip)}" style="--i:${i}"><span class="pk">${esc(sd[0]==='FPTS'?'Fantasy':sd[0])}</span><span class="num pf">${f1(p.floor)}</span><span class="num ps">${f1(p.proj)}</span><span class="num pu">${f1(p.up)}</span><span class="pbar"><i class="rng" style="left:${X(p.floor)};width:calc(${X(p.up)} - ${X(p.floor)})"></i><i class="avg" style="left:${X(p.rec)}"></i><i class="dot" style="left:${X(p.proj)}"></i></span></div>`}).join('');
  h+=`<p class="fine">A quick summary of the numbers on this page, not a guarantee. The dot is the standard projection, the shaded band runs floor to upside, and the thin line is his last-${c.projN} average.</p>`;
  box.innerHTML=h;
}

// ---------------- hover / tap commentary
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);
let tipFor=null;
function tipHtml(t){const [title,...ls]=t.split('\n');return `<b class="tt">${esc(title)}</b>`+ls.map(l=>{if(l.startsWith('~'))return `<span class="tn">${esc(l.slice(1))}</span>`;const q=l.split('::');if(q.length>=2)return `<span class="tr ${esc(q[2]||'')}"><span>${esc(q[0])}</span><b>${esc(q[1])}</b></span>`;return `<span class="tp">${esc(l)}</span>`}).join('')}
function showTip(el){const t=el.getAttribute('data-tip');if(!t){hideTip();return}tipFor=el;tipEl.innerHTML=tipHtml(t);tipEl.classList.add('on');
  const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  const x=clamp(r.left+r.width/2-w/2,12,innerWidth-w-12);let y=r.top-h-10;if(y<72)y=Math.min(r.bottom+10,innerHeight-h-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
function hideTip(){tipFor=null;tipEl.classList.remove('on')}
document.addEventListener('mouseover',e=>{const el=e.target.closest?e.target.closest('[data-tip]'):null;if(el){if(el!==tipFor)showTip(el)}else if(tipFor)hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest?e.target.closest('[data-tip]'):null;if(el)showTip(el)});
document.addEventListener('focusout',hideTip);
addEventListener('scroll',hideTip,{passive:true});

// ---------------- masthead ticket
function renderTicket(){
  const ng=nextGame(P.t),tk=$('ticket');
  if(!ng){tk.hidden=true;return}
  const home=ng[1]===P.t,oi=home?ng[2]:ng[1],me=D.teams[P.t],o=D.teams[oi],dt=new Date(ng[0]);
  document.documentElement.style.setProperty('--oc','#'+o.c);
  const chips=[],sd=statDef(),sl=sd[1].toLowerCase(),me_=splitOf(playerWin(),sd[2],r=>r[1]),c=cfg();
  chips.push([home?'Home':'Away',false,me_.home.n&&me_.away.n?T(home?'Home game':'Road game',['At home',`${f1(me_.home.avg)} (${me_.home.n} g)`,home?'b':''],['On the road',`${f1(me_.away.avg)} (${me_.away.n} g)`,home?'':'b'],`~His ${sl} since ${c.seasonLbl(curSeason()-1)}.`):'']);
  const r1=restFor(P.t,ng),r2=restFor(oi,ng);
  if(r1!=null&&r1>=0){const[a,hot]=c.rest(r1),rb=c.restB(r1),x=me_[rb];chips.push([a,hot,x&&x.n?T(c.restLbl[rb],['In this spot',`${f1(x.avg)} (${x.n} g)`,x.avg>=me_.all.avg?'up':'dn'],['Overall',f1(me_.all.avg)],`~His ${sl}.`,x.n<5?'~Small sample.':null):T(c.restLbl[rb],'~No games in this rest spot to compare yet.')])}
  if(r2!=null&&r2>=0){const[a,hot]=c.rest(r2);if(hot){const rb=c.restB(r2),ds=P.b?defSplit(oi,P.b,sd[2]):null,x=ds&&ds[rb];chips.push([`${nick(o)}: ${a.toLowerCase()}`,true,x&&x.n?T(`${nick(o)} on ${c.restLbl[rb].toLowerCase()}`,[`${sd[0]} allowed in this spot`,`${f1(x.avg)} (${x.n} g)`,x.avg>=ds.all.avg?'up':'dn'],['Normally',f1(ds.all.avg)],'~Tired legs on defense can help him.'):T(`${nick(o)} on ${c.restLbl[rb].toLowerCase()}`,'~Tired legs on defense can help him.')])}}
  const t=P.b?tierOf(oi):null;if(t){const dv=D.dvp[P.b],NT=D.teams.length;chips.push([`${t[0]} vs ${c.posName[P.b]}`,/favorable/i.test(t[0]),T(`${t[0]} matchup`,...dv.k.map((k,i)=>{const rk=dv.rank[oi][i];return [c.dvpLbl[k]||k,`${ord(rk)} most allowed`,rk<=NT/3?'up':rk>2*NT/3?'dn':'']}),`~Where the ${nick(o)} rank among ${NT} teams in what they give up to ${c.posName[P.b]} this season.`)])}
  const oinj=injFor(oi);if(oinj){const ls=oinj.filter(i=>/^out|reserve/i.test(i.s));if(ls.length)chips.push([`${nick(o)}: ${ls.length} out`,false,T(`${o.n}: out`,...ls.map(i=>[i.n,i.p]))])}
  const minj=injFor(P.t);if(minj){const ls=minj.filter(i=>/^out|reserve/i.test(i.s)&&norm(i.n)!==norm(P.n));if(ls.length)chips.push([`${nick(me)}: ${ls.length} out`,false,T(`${me.n}: out`,...ls.map(i=>[i.n,i.p]))])}
  tk.hidden=false;
  tk.innerHTML=`<div class="face"><div>${logoImg(me)}<div class="lbl">${esc(me.a)}</div></div><div class="vsx">${home?'VS':'@'}</div><div>${logoImg(o)}<div class="lbl">${esc(o.a)}</div></div></div>
    <div class="when">Next game · ${esc(dt.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}))} · ${esc(dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))}</div>
    <div class="ctx">${chips.map(([a,hot,tp])=>`<span class="${hot?'hot':''}"${tp?` tabindex="0" data-tip="${esc(tp)}"`:''}>${esc(a)}</span>`).join('')}</div>`;
}

// ---------------- player
function setPlayer(p){
  P=p;st.mark=null;$('mark').value='';
  const pc=posCfg();if(!pc.stats.some(s=>s[0]===st.stat))st.stat=pc.stats[0][0];
  save();
  const t=D.teams[p.t];document.documentElement.style.setProperty('--tc','#'+t.c);
  document.documentElement.style.setProperty('--tink',lum(t.c)>.45?'#111':'#fff');
  const wm=$('wm');wm.hidden=false;wm.onerror=()=>{wm.hidden=true};wm.src=logoUrl(t);
  $('mono').textContent=cfg().mono(p)||'';replay($('mono'),'in');
  $('pname').textContent=p.n;
  $('pmeta').textContent=[t.n,...cfg().meta(p)].filter(Boolean).join(' · ');
  const ng=nextGame(p.t);st.opp=ng?(ng[1]===p.t?ng[2]:ng[1]):null;
  const pg=played(p.g);if(st.opp==null&&pg.length)st.opp=pg[pg.length-1][2];
  let cs=played(p.g.filter(r=>D.games[r[0]][1]===curSeason())),lbl=cfg().seasonLbl(curSeason());
  if(!cs.length){cs=played(p.g.filter(r=>D.games[r[0]][1]===curSeason()-1));lbl=cfg().seasonLbl(curSeason()-1)}
  const statLbl=k=>{const s=pc.stats.find(x=>x[0]===k);return s?s[1]:k};
  $('tiles').innerHTML=pc.tiles.map(k=>`<div class="tile"><span class="big" data-k="${esc(k)}">0.0</span><small>${esc(k==='FPTS'?'Fantasy':statLbl(k).replace('Threes made','3PM'))}</small></div>`).join('');
  for(const el of $('tiles').querySelectorAll('.big')){const k=el.dataset.k,s=pc.stats.find(x=>x[0]===k),fn=s?s[2]:(r=>v(r,k));countUp(el,mean(cs.map(fn)))}
  $('tiles').title='';
  {const rec=played(p.g).slice(-cfg().projN);for(const el of $('tiles').querySelectorAll('.tile')){const k=el.querySelector('.big').dataset.k,s_=pc.stats.find(x=>x[0]===k),fn=s_?s_[2]:(r=>v(r,k)),a=mean(cs.map(fn)),b=mean(rec.map(fn)),d=a?(b-a)/a*100:0;
    el.tabIndex=0;el.dataset.tip=T(s_?s_[1]:k,['This season',`${f1(a)} (${cs.length} g)`],[`Last ${rec.length}`,f1(b),Math.abs(d)<5?'b':d>0?'up':'dn'],['Trend',`${d>=0?'+':''}${Math.round(d)}%`,Math.abs(d)<5?'':d>0?'up':'dn'],'~'+(Math.abs(d)<5?'Right in line with his season.':d>0?'Running hot lately.':'Cooler lately.'))}}
  $('opp').innerHTML=D.teams.map((tm,i)=>i===p.t?'':`<option value="${i}">${esc(tm.n)}</option>`).join('');
  if(st.opp!=null)$('opp').value=st.opp;
  $('q').value='';
  replay($('whoBox'),'in');
  renderContext();render(true);
  replay($('ticket'),'in2');
}

function render(anim){
  if(!P)return;
  const c=cfg(),pc=posCfg(),[k,label,fn]=statDef();
  setChips($('statGrp'),pc.stats.map(s=>[s[0],s[0]==='FPTS'?'Fantasy':s[0]]),'stat');
  setChips($('rangeGrp'),[...c.ranges,['season','This season'],['last',c.seasonLbl(curSeason()-1)],['all','All']],'range','Games');
  setChips($('locGrp'),[['all','All'],['home','Home'],['away','Away']],'loc','Where');
  const rows=rangeRows(),pr=played(rows),vals=pr.map(fn);
  const rl=st.range==='season'?'this season':st.range==='last'?c.seasonLbl(curSeason()-1):st.range==='all'?'all games since '+since():'last '+st.range+' games';
  $('recTitle').textContent=`${label}, ${rl}${st.loc==='home'?' at home':st.loc==='away'?' on the road':''}`;
  let sum=`<span><span class="big" id="avgBig">${f1(mean(vals))}</span> avg</span><span>median ${f1(median(vals))}</span><span>high ${vals.length?esc(fv(Math.max(...vals))):'–'}</span><span>low ${vals.length?esc(fv(Math.min(...vals))):'–'}</span><span>${pr.length} games${rows.length>pr.length?` (+${rows.length-pr.length} DNP)`:''}</span>`;
  if(st.mark!=null&&vals.length){const h=vals.filter(x=>x>=st.mark).length;sum+=`<span class="hit">${h} of ${vals.length} at or above ${esc(st.mark)} (${Math.round(h/vals.length*100)}%)</span>`}
  if(vals.length)sum+=legend(mean(vals),'his average here');
  $('recSum').innerHTML=sum;if(anim)countUp($('avgBig'),mean(vals));
  bars($('recSvg'),rows,false,mean(vals));
  $('recAvg').innerHTML=pr.length?pc.avgs(pr).map(([a,b])=>`<div><span class="big">${esc(b)}</span><small>${esc(a)}</small></div>`).join(''):'';
  $('recTbl').innerHTML=logTable(rows,false,mean(vals));
  renderSplits();renderMatchup();renderProj();
}
function renderMatchup(){
  const pc=posCfg(),[k,,fn]=statDef();
  const o=D.teams[st.opp],ng=nextGame(P.t),isNext=ng&&(ng[1]===st.opp||ng[2]===st.opp);
  $('vsTitle').innerHTML=o?`${logoImg(o)}Matchup: ${esc(o.n)}`:'Matchup';
  $('vsSub').textContent=isNext?`Next opponent · ${new Date(ng[0]).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}`:'Pick any opponent to compare';
  $('dvp').innerHTML=dvpHtml();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{for(const i of $('dvp').querySelectorAll('.track i'))i.style.left=i.dataset.x+'%'}));
  const vr=P.g.filter(r=>r[2]===st.opp),vp=played(vr),vv=vp.map(fn),all=played(P.g);
  $('histTitle').textContent=`His games against the ${o?nick(o):''}`;
  $('histSub').innerHTML=`${vp.length} game${vp.length===1?'':'s'} since ${esc(since())}${vr.length>vp.length?`, ${vr.length-vp.length} missed`:''}${vp.length?' &nbsp; '+legend(mean(playerWin().map(fn)),'his usual'):''}`;
  const cmpKeys=[k,...pc.tiles.filter(x=>x!==k)].slice(0,5);
  $('vsCmp').innerHTML=vp.length?cmpKeys.map(kk=>{const s=pc.stats.find(x=>x[0]===kk),f=s?s[2]:(r=>v(r,kk)),a=mean(vp.map(f)),b=mean(all.map(f)),d=a-b;
    return `<div><span class="big">${f1(a)}</span><small>${esc(kk==='FPTS'?'Fantasy':kk)} vs them</small><small class="${d>=0?'up':'dn'}">${d>=0?'+':''}${f1(d)} vs his ${f1(b)} overall</small></div>`}).join('')+(st.mark!=null&&vv.length?`<div><span class="big" style="color:var(--acc)">${vv.filter(x=>x>=st.mark).length}/${vv.length}</span><small>${esc(k)} at or above ${esc(st.mark)}</small></div>`:''):'';
  $('vsFig').style.display=vp.length?'':'none';
  const usual=mean(playerWin().map(fn));
  if(vp.length)bars($('vsSvg'),vr,true,usual);
  $('vsTbl').innerHTML=vr.length?logTable(vr,true,usual):`<tbody><tr><td class="empty">No games against the ${esc(o?o.n:'this team')} since ${esc(since())}.</td></tr></tbody>`;
}

// ---------------- search
let hits=[],hi=0;
function search(){
  const q=norm($('q').value),dd=$('dd');
  if(!q||!D){dd.classList.remove('on');return}
  hits=D.players.filter(p=>p._k.includes(q)).sort((a,b)=>(b._k.startsWith(q)-a._k.startsWith(q))||(b._m-a._m)).slice(0,12);hi=0;
  dd.innerHTML=hits.length?hits.map((p,i)=>`<button role="option" data-i="${i}" class="${i===0?'hl':''}"><img src="${esc(logoUrl(D.teams[p.t]))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="nm">${esc(p.n)}</span><small>${esc(D.teams[p.t].a)} · ${esc(p.p)}</small></button>`).join(''):'<div class="empty" style="padding:14px">No player found</div>';
  dd.classList.add('on');
}
$('q').addEventListener('input',search);
$('q').addEventListener('keydown',e=>{const bs=$('dd').querySelectorAll('button');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!bs.length)return;bs[hi]?.classList.remove('hl');hi=(hi+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[hi].classList.add('hl');bs[hi].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'&&hits[hi]){$('dd').classList.remove('on');setPlayer(hits[hi]);$('q').blur()}
  if(e.key==='Escape')$('dd').classList.remove('on')});
$('dd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('dd').classList.remove('on');setPlayer(hits[+b.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))$('dd').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus()}});
$('mark').addEventListener('input',e=>{const x=parseFloat(e.target.value);st.mark=Number.isFinite(x)?x:null;render(false)});
$('opp').addEventListener('change',e=>{st.opp=+e.target.value;renderSplits();renderMatchup()});
$('lgGrp').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&b.dataset.v!==L)load(b.dataset.v)});

// ---------------- load
fetch('news.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null).then(n=>{N=n||{updated:null};if(P)renderContext()});
function load(lg){
  L=lg;for(const b of $('lgGrp').querySelectorAll('.chip'))b.setAttribute('aria-pressed',b.dataset.v===L);
  $('q').placeholder=`Search any ${cfg().name} player…`;$('thru').textContent='Loading…';
  const sv=saved[L]||{};st={stat:sv.stat||null,range:sv.range||cfg().defRange,loc:sv.loc||'all',mark:null,opp:null};
  const go=d=>{
    if(L!==lg)return;D=d;C={};d.cols.forEach((k,i)=>C[k]=i+7);buildTG();
    $('thru').textContent=cfg().thru(d);
    $('foot').textContent=lg==='nba'?'NBA box scores from ESPN via the open hoopR dataset: regular season, play-in and playoffs from the last three seasons. Defense vs position uses this season only, grouped by guard, forward and center. Injuries and news from ESPN. Averages skip games the player didn’t play. Refreshed automatically every hour. No odds or lines are shown.'
      :'NFL weekly player stats and schedule from the open nflverse data: regular season and playoffs from the last three seasons. Defense vs position uses this season only. Fantasy points are PPR. Injuries and news from ESPN. Refreshed automatically every hour. No odds or lines are shown.';
    P=null;
    setPlayer(D.players.find(p=>p.id===sv.pid)||D.players.find(p=>p.n===cfg().defPlayer)||D.players[0]);
  };
  if(cache[lg])return go(cache[lg]);
  fetch(cfg().file,{cache:'no-cache'}).then(r=>r.json()).then(d=>{
    const cs=d.season;
    for(const p of d.players){p._k=norm(p.n);p._m=p.g.reduce((a,r)=>a+(r.length>7&&d.games[r[0]][1]>=cs-1?(lg==='nba'?r[7]:r[r.length-1]+1):0),0)}
    cache[lg]=d;go(d);
  }).catch(()=>{if(L===lg){$('thru').textContent='Could not load stats.';$('pname').textContent='Data failed to load'}});
}
load(saved.league==='nfl'?'nfl':'nba');
}
