<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Game Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical box-score desk, numbers first, no odds, no hype.
   IDEA: a printed scouting card — team-colour masthead over agate game logs.
   PICTURE: the game-by-game bar strip for the chosen stat, opponent under each bar.
   COLOUR and TYPE: white sheet / night court; the player's team colour leads, ink support, court orange as the one accent; Barlow Condensed figures + Barlow text.
   LAYOUT: search bar, masthead band, controls, chart, averages, log; then the matchup section: defense-vs-position write-up, history strip and log. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1115);--ink:light-dark(#14161a,#eceef2);--mut:light-dark(#646a73,#9aa1ab);--line:light-dark(#e3e5e9,#262a31);--soft:light-dark(#f4f5f7,#171a20);--acc:#f26b1d;--good:light-dark(#1a7f37,#4ac26b);--bad:light-dark(#c62828,#ff6b6b);--tc:#1d428a;--tcb:light-dark(var(--tc),color-mix(in oklab,var(--tc) 50%,white));--tink:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(18px,3vw,36px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,.big,.next b,.chip{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif}
svg{font-family:Barlow,system-ui,sans-serif}
.top{border-bottom:1px solid var(--line);padding-block:14px}
.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lg{display:flex;gap:4px}
.lg .chip{min-height:46px;padding:0 16px;font-size:18px}
.srch{position:relative;flex:1 1 300px;max-width:560px}
.srch input{width:100%;font:16px Barlow,sans-serif;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);min-height:46px}
.srch input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.dd{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0/.18);max-height:360px;overflow:auto;display:none}
.dd.on{display:block}
.dd button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 14px;min-height:44px;border:0;background:none;color:var(--ink);font:15px Barlow,sans-serif;cursor:pointer}
.dd button:hover,.dd button.hl{background:var(--soft)}
.dd small{color:var(--mut)}
.thru{color:var(--mut);font-size:13px}
.mast{background:var(--tc);color:var(--tink)}
.mast .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:end}
h1{font-size:clamp(36px,6vw,52px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.meta{opacity:.85;margin-top:4px}
.next{margin-top:14px;display:inline-flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:rgb(0 0 0/.18);padding:8px 12px;border-radius:8px;font-weight:500}
.next b{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{background:rgb(255 255 255/.1);border-radius:8px;padding:8px 10px}
.tile .big{font-size:30px;line-height:1;font-weight:600}
.tile small{display:block;opacity:.8;font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp>span{font-size:13px;color:var(--mut);margin-right:4px}
.chip{font-size:15px;font-weight:600;flex:none;min-height:36px;padding:0 11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mark input,select{font:16px Barlow,sans-serif;min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.mark input{width:84px}
h2{font-size:32px;line-height:1.05;margin:0 0 4px;font-weight:700}
h3{font-size:24px;line-height:1.1;margin:0;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px}
.sum{display:flex;flex-wrap:wrap;gap:8px 22px;margin:4px 0 10px;align-items:baseline}
.sum .big{font-size:40px;font-weight:700;line-height:1}
.sum .hit{color:var(--acc);font-weight:600}
.fig{position:relative;min-height:300px;border-bottom:1px solid var(--line)}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.avgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
.avgs div{background:var(--bg);padding:8px 10px}
.avgs .big{font-size:24px;font-weight:600;line-height:1.1;display:block}
.avgs small{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mut);font-size:13px;background:var(--bg)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td.hl{font-weight:700;background:color-mix(in oklab,var(--tcb) 14%,transparent)}
tr.dnp td{color:var(--mut)}
.tag{font-size:11px;font-weight:600;color:var(--acc);margin-left:4px}
.W{color:var(--good)}.L{color:var(--bad)}
.vs{background:var(--soft);border-top:1px solid var(--line)}
.vs .head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.dvp{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.5vw,24px);margin-bottom:22px}
.dvp .verdict{display:flex;gap:10px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.pill{font:700 15px "Barlow Condensed",Barlow,sans-serif;padding:3px 10px;border-radius:999px;color:#fff}
.dvp p{margin:6px 0 14px;max-width:70ch}
.dvrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px 20px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dvrow .txt b{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:20px}
.dvrow .txt small{display:block;color:var(--mut);font-size:13px}
.track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in oklab,var(--bad) 55%,transparent),color-mix(in oklab,var(--mut) 25%,transparent),color-mix(in oklab,var(--good) 55%,transparent))}
.track i{position:absolute;top:-5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0 16px}
.cmp div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cmp .big{font-size:28px;font-weight:700;line-height:1}
.cmp small{display:block;color:var(--mut);font-size:13px}
.up{color:var(--good)}.dn{color:var(--bad)}
.empty{padding:28px 0;color:var(--mut);text-align:center}
.foot{color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:760px){.mast .wrap{grid-template-columns:minmax(0,1fr)}.tile .big{font-size:24px}}
@media(max-width:600px){#statGrp{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:calc(-1*max(5vw,16px));padding-inline:max(5vw,16px)}table{font-size:13px}.fig{min-height:240px}.tile{padding:6px}.tile small{font-size:12px}.dvrow{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.bar{transition:height .25s,y .25s}}
</style>
</head>
<body>
<div class="band top"><div class="wrap">
  <div class="lg" id="lgGrp" role="group" aria-label="League">
    <button class="chip" data-v="nba" aria-pressed="false">NBA</button>
    <button class="chip" data-v="nfl" aria-pressed="false">NFL</button>
  </div>
  <div class="srch">
    <input id="q" type="search" placeholder="Search any player…" autocomplete="off" aria-label="Search players" aria-controls="dd">
    <div class="dd" id="dd" role="listbox"></div>
  </div>
  <span class="thru" id="thru">Loading…</span>
</div></div>

<div class="band mast"><div class="wrap">
  <div>
    <h1 id="pname">&nbsp;</h1>
    <div class="meta" id="pmeta"></div>
    <div class="next" id="pnext" hidden></div>
  </div>
  <div><div class="tiles" id="tiles"></div></div>
</div></div>

<div class="band"><div class="wrap">
  <div class="ctl"><div class="grp" id="statGrp" aria-label="Stat"></div></div>
  <div class="ctl">
    <div class="grp" id="rangeGrp"><span>Games</span></div>
    <div class="grp" id="locGrp"><span>Where</span></div>
    <label class="grp mark"><span>Mark a number</span><input id="mark" type="number" step="0.5" inputmode="decimal" placeholder="optional"></label>
  </div>
  <h2 id="recTitle">Recent games</h2>
  <div class="sum" id="recSum"></div>
  <div class="fig"><svg id="recSvg" role="img" aria-label="Game by game chart"></svg></div>
  <div class="avgs" id="recAvg"></div>
  <div class="scroll"><table id="recTbl"></table></div>
</div></div>

<div class="band vs"><div class="wrap">
  <div class="head">
    <div><h2 id="vsTitle">Matchup</h2><p class="sub" id="vsSub"></p></div>
    <label class="grp"><span>Opponent</span><select id="opp" aria-label="Opponent"></select></label>
  </div>
  <div class="dvp" id="dvp"></div>
  <h3 id="histTitle">His games against them</h3>
  <p class="sub" id="histSub"></p>
  <div class="cmp" id="vsCmp"></div>
  <div class="fig" id="vsFig"><svg id="vsSvg" role="img" aria-label="Games against opponent chart"></svg></div>
  <div class="scroll" style="margin-top:14px"><table id="vsTbl"></table></div>
</div></div>

<div class="band foot"><div class="wrap" id="foot"></div></div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const f1=v=>Number.isFinite(v)?(Math.round(v*10)/10).toFixed(1):'–';
const fv=v=>Number.isInteger(v)?String(v):(Math.round(v*10)/10).toFixed(1);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const median=a=>{if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y),h=(b.length-1)/2;return (b[Math.floor(h)]+b[Math.ceil(h)])/2};
const pct=(m,a)=>a?(Math.round(m/a*1000)/10)+'%':'–';
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const lum=h=>{const n=parseInt(h,16),f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)};

let D=null,C={},P=null,L='nba';const cache={};
const v=(r,k)=>r[C[k]];
const isDNP=r=>r.length<=7;
const played=rows=>rows.filter(r=>!isDNP(r));

// ---------------- league definitions
const NBA={
  name:'NBA',file:'nba.json',hours:3,ranges:[['5','L5'],['10','L10'],['15','L15'],['20','L20']],defRange:'10',defPlayer:'Shai Gilgeous-Alexander',
  seasonLbl:s=>`${s-1}-${String(s).slice(2)}`,
  thru:d=>{const[y,m,dd]=d.through.split('-');return `Box scores through ${MON[+m-1]} ${+dd}, ${y}`},
  posName:{G:'guards',F:'forwards',C:'centers'},
  dvpLbl:{PTS:'points',REB:'rebounds',AST:'assists','3PM':'threes',PRA:'points + rebounds + assists'},
  meta:p=>[p.p==='G'?'Guard':p.p==='F'?'Forward':p.p==='C'?'Center':p.p,p.j?'#'+p.j:''],
  pos:()=>({
    stats:[['PTS','Points',r=>v(r,'PTS')],['REB','Rebounds',r=>v(r,'REB')],['AST','Assists',r=>v(r,'AST')],['3PM','Threes made',r=>v(r,'3PM')],
      ['PRA','Pts + Reb + Ast',r=>v(r,'PTS')+v(r,'REB')+v(r,'AST')],['P+R','Pts + Reb',r=>v(r,'PTS')+v(r,'REB')],['P+A','Pts + Ast',r=>v(r,'PTS')+v(r,'AST')],['R+A','Reb + Ast',r=>v(r,'REB')+v(r,'AST')],
      ['STL','Steals',r=>v(r,'STL')],['BLK','Blocks',r=>v(r,'BLK')],['STL+BLK','Steals + Blocks',r=>v(r,'STL')+v(r,'BLK')],['TO','Turnovers',r=>v(r,'TO')],
      ['MIN','Minutes',r=>v(r,'MIN')],['FGA','Field goal attempts',r=>v(r,'FGA')],['3PA','Three attempts',r=>v(r,'3PA')],['FTA','Free throw attempts',r=>v(r,'FTA')]],
    tiles:['PTS','REB','AST','3PM','MIN'],
    table:[['MIN'],['PTS'],['REB'],['AST'],['3PM'],['STL'],['BLK'],['TO'],['FG',r=>v(r,'FGM')+'-'+v(r,'FGA')],['3P',r=>v(r,'3PM')+'-'+v(r,'3PA')],['FT',r=>v(r,'FTM')+'-'+v(r,'FTA')],['+/-',r=>(v(r,'PM')>0?'+':'')+v(r,'PM')]],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['MIN',m('MIN')],['PTS',m('PTS')],['REB',m('REB')],['AST',m('AST')],['3PM',m('3PM')],['STL',m('STL')],['BLK',m('BLK')],['TO',m('TO')],
        ['PRA',f1(mean(pr.map(r=>v(r,'PTS')+v(r,'REB')+v(r,'AST'))))],['FG%',pct(s('FGM'),s('FGA'))],['3P%',pct(s('3PM'),s('3PA'))],['FT%',pct(s('FTM'),s('FTA'))]]}
  }),
  dateLbl:(g,yr)=>{const[y,m,d]=g[0].split('-');return `${MON[+m-1]} ${+d}`+(yr?` '${y.slice(2)}`:'')},
  tag:g=>g[2]===3?'PO':g[2]===5?'PI':''
};
const NFLPOS={
  QB:{stats:[['PYD','Pass yds',r=>v(r,'PYD')],['PTD','Pass TD',r=>v(r,'PTD')],['CMP','Completions',r=>v(r,'CMP')],['ATT','Pass attempts',r=>v(r,'ATT')],['INT','Interceptions',r=>v(r,'INT')],
      ['RYD','Rush yds',r=>v(r,'RYD')],['P+R YDS','Pass + rush yds',r=>v(r,'PYD')+v(r,'RYD')],['CAR','Carries',r=>v(r,'CAR')],['FPTS','Fantasy pts (PPR)',r=>v(r,'FPTS')]],
    tiles:['PYD','PTD','INT','RYD','FPTS'],
    table:[['C/A',r=>v(r,'CMP')+'/'+v(r,'ATT')],['PYD'],['PTD'],['INT'],['SK'],['CAR'],['RYD'],['RTD'],['FPTS']],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['Pass yds',m('PYD')],['Pass TD',m('PTD')],['INT',m('INT')],['Comp',m('CMP')],['Att',m('ATT')],['Comp %',pct(s('CMP'),s('ATT'))],['Yds/att',s('ATT')?f1(s('PYD')/s('ATT')):'–'],['Sacks',m('SK')],['Rush yds',m('RYD')],['Fantasy',m('FPTS')]]}},
  RB:{stats:[['RYD','Rush yds',r=>v(r,'RYD')],['CAR','Carries',r=>v(r,'CAR')],['REC','Receptions',r=>v(r,'REC')],['RECYD','Rec yds',r=>v(r,'RECYD')],
      ['R+R YDS','Rush + rec yds',r=>v(r,'RYD')+v(r,'RECYD')],['TD','Total TDs',r=>v(r,'RTD')+v(r,'RECTD')],['TGT','Targets',r=>v(r,'TGT')],['FPTS','Fantasy pts (PPR)',r=>v(r,'FPTS')]],
    tiles:['RYD','CAR','REC','RECYD','FPTS'],
    table:[['CAR'],['RYD'],['RTD'],['TGT'],['REC'],['RECYD'],['RECTD'],['FUM',r=>v(r,'FUML')],['FPTS']],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['Carries',m('CAR')],['Rush yds',m('RYD')],['Yds/carry',s('CAR')?f1(s('RYD')/s('CAR')):'–'],['Targets',m('TGT')],['Rec',m('REC')],['Rec yds',m('RECYD')],['Scrim yds',f1(mean(pr.map(r=>v(r,'RYD')+v(r,'RECYD'))))],['TDs',f1(mean(pr.map(r=>v(r,'RTD')+v(r,'RECTD'))))],['Fantasy',m('FPTS')]]}},
  WR:{stats:[['REC','Receptions',r=>v(r,'REC')],['RECYD','Rec yds',r=>v(r,'RECYD')],['TGT','Targets',r=>v(r,'TGT')],['RECTD','Rec TD',r=>v(r,'RECTD')],
      ['R+R YDS','Rush + rec yds',r=>v(r,'RYD')+v(r,'RECYD')],['FPTS','Fantasy pts (PPR)',r=>v(r,'FPTS')]],
    tiles:['REC','RECYD','TGT','RECTD','FPTS'],
    table:[['TGT'],['REC'],['RECYD'],['RECTD'],['Y/R',r=>v(r,'REC')?f1(v(r,'RECYD')/v(r,'REC')):'–'],['CAR'],['RYD'],['FPTS']],
    avgs:pr=>{const m=k=>f1(mean(pr.map(r=>v(r,k)))),s=k=>pr.reduce((a,r)=>a+v(r,k),0);
      return [['Targets',m('TGT')],['Rec',m('REC')],['Rec yds',m('RECYD')],['Rec TD',m('RECTD')],['Catch %',pct(s('REC'),s('TGT'))],['Yds/rec',s('REC')?f1(s('RECYD')/s('REC')):'–'],['Fantasy',m('FPTS')]]}}
};
NFLPOS.TE=NFLPOS.WR;
const NFL_WK={19:'WC',20:'DIV',21:'CON',22:'SB'};
const NFL={
  name:'NFL',file:'nfl.json',hours:4,ranges:[['3','L3'],['5','L5'],['8','L8']],defRange:'5',defPlayer:'Patrick Mahomes',
  seasonLbl:s=>String(s),
  thru:d=>`Stats through ${d.through}, ${d.season} season`,
  posName:{QB:'quarterbacks',RB:'running backs',WR:'wide receivers',TE:'tight ends'},
  dvpLbl:{PYD:'passing yards',PTD:'passing TDs',RYD:'rushing yards',REC:'receptions',RECYD:'receiving yards',RECTD:'receiving TDs',FPTS:'PPR fantasy points'},
  meta:p=>[{QB:'Quarterback',RB:'Running back',WR:'Wide receiver',TE:'Tight end'}[p.p]||p.p],
  pos:p=>NFLPOS[p.p]||NFLPOS.WR,
  dateLbl:(g,yr)=>{const[y,m,d]=g[0].split('-');return `${NFL_WK[g[3]]||'Wk '+g[3]} · ${MON[+m-1]} ${+d}`+(yr?` '${y.slice(2)}`:'')},
  tag:g=>g[2]===3?'PO':''
};
const LG={nba:NBA,nfl:NFL};
const cfg=()=>LG[L];

// ---------------- state
let st={stat:null,range:null,loc:'all',mark:null,opp:null},saved={};
try{saved=JSON.parse(localStorage.getItem('pgl2')||'{}')}catch(e){}
const save=()=>{try{saved.league=L;saved[L]={pid:P&&P.id,stat:st.stat,range:st.range,loc:st.loc};localStorage.setItem('pgl2',JSON.stringify(saved))}catch(e){}};
const curSeason=()=>D.season;
const since=()=>cfg().seasonLbl(D.games[0][1]);
const posCfg=()=>cfg().pos(P);
const statDef=()=>{const s=posCfg().stats;return s.find(x=>x[0]===st.stat)||s[0]};

function rangeRows(){
  let rows=P.g.slice();const cs=curSeason();
  if(st.loc==='home')rows=rows.filter(r=>r[3]===1);if(st.loc==='away')rows=rows.filter(r=>r[3]===0);
  if(st.range==='season')return rows.filter(r=>D.games[r[0]][1]===cs);
  if(st.range==='last')return rows.filter(r=>D.games[r[0]][1]===cs-1);
  if(st.range==='all')return rows;
  const n=+st.range,out=[];let k=0;
  for(let i=rows.length-1;i>=0&&k<n;i--){out.unshift(rows[i]);if(!isDNP(rows[i]))k++}
  return out;
}

function setChips(el,list,key,lead){
  el.innerHTML=(lead?`<span>${lead}</span>`:'')+list.map(([val,l])=>`<button class="chip" data-v="${esc(val)}" aria-pressed="${st[key]===val}">${esc(l)}</button>`).join('');
}
for(const[id,key]of[['statGrp','stat'],['rangeGrp','range'],['locGrp','loc']])
  $(id).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st[key]=b.dataset.v;save();render()});

// ---------------- chart
function bars(svg,rows,withYear){
  const draw=()=>{
    const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
    const fn=statDef()[2],pr=played(rows);
    if(!pr.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mut)" font-size="15">No games in this view</text>`;return}
    const vals=pr.map(fn),mx=Math.max(1,...vals,st.mark||0)*1.12,av=mean(vals);
    const padT=22,padB=withYear?40:28,padL=W<520?6:34,padR=6,cw=(W-padL-padR)/pr.length,bw=Math.max(2,Math.min(46,cw*.72));
    const y=val=>padT+(H-padT-padB)*(1-Math.max(0,val)/mx);
    let s='';
    if(W>=520){const step=mx>250?50:mx>100?25:mx>40?10:mx>16?5:mx>6?2:1;for(let t=0;t<=mx;t+=step)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${t}</text>`}
    pr.forEach((r,i)=>{const val=fn(r),x=padL+cw*i+(cw-bw)/2,g=D.games[r[0]],o=D.teams[r[2]];
      const hit=st.mark!=null&&val>=st.mark,fill=st.mark==null||hit?'var(--tcb)':'color-mix(in oklab,var(--mut) 45%,transparent)';
      s+=`<g><title>${esc(cfg().dateLbl(g,true))} ${r[3]?'vs':'@'} ${esc(o.a)} · ${r[4]?'W':'L'} ${r[5]}-${r[6]} · ${esc(fv(val))} ${esc(statDef()[1])}</title>`;
      s+=`<rect class="bar" x="${x}" y="${y(val)}" width="${bw}" height="${Math.max(0,y(0)-y(val))}" rx="${Math.min(4,bw/4)}" fill="${fill}"/>`;
      if(cw>=18)s+=`<text x="${x+bw/2}" y="${y(val)-6}" text-anchor="middle" font-size="${cw>30?13:11}" font-weight="600" fill="var(--ink)">${esc(fv(val))}</text>`;
      if(cw>=36)s+=`<text x="${x+bw/2}" y="${H-padB+15}" text-anchor="middle" font-size="11" fill="var(--mut)">${r[3]?'':'@'}${esc(o.a)}</text>`;
      if(withYear&&cw>=44)s+=`<text x="${x+bw/2}" y="${H-padB+30}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(g[0].slice(0,4))}</text>`;
      s+='</g>'});
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(av)}" y2="${y(av)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    s+=`<text x="${padL+4}" y="${y(av)-6}" font-size="12" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">avg ${f1(av)}</text>`;
    if(st.mark!=null)s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(st.mark)}" y2="${y(st.mark)}" stroke="var(--acc)" stroke-width="2"/><text x="${W-padR-4}" y="${y(st.mark)-6}" text-anchor="end" font-size="12" font-weight="600" fill="var(--acc)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">${esc(st.mark)}</text>`;
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mut)"/>`;
    svg.innerHTML=s;
  };
  if(svg._ro)svg._ro.disconnect();svg._ro=new ResizeObserver(draw);svg._ro.observe(svg);draw();
}

function logTable(rows,withYear){
  const pc=posCfg(),sd=statDef(),cols=pc.table,inTable=cols.some(c=>c[0]===st.stat&&!c[1]);
  let s=`<thead><tr><th>${L==='nfl'?'Game':'Date'}</th><th>Opp</th><th>Result</th>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}${inTable?'':`<th>${esc(st.stat)}</th>`}</tr></thead><tbody>`;
  for(const r of rows.slice().reverse()){
    const g=D.games[r[0]],o=D.teams[r[2]],tg=cfg().tag(g);
    const head=`<td>${esc(cfg().dateLbl(g,withYear||g[1]!==curSeason()))}${tg?`<span class="tag">${tg}</span>`:''}</td><td>${r[3]?'vs':'@'} ${esc(o.a)}</td><td><span class="${r[4]?'W':'L'}">${r[4]?'W':'L'}</span> ${r[5]}-${r[6]}</td>`;
    if(isDNP(r)){s+=`<tr class="dnp">${head}<td colspan="${cols.length+(inTable?0:1)}" style="text-align:left">Did not play</td></tr>`;continue}
    s+=`<tr>${head}${cols.map(c=>`<td${c[0]===st.stat&&!c[1]?' class="hl"':''}>${esc(c[1]?c[1](r):fv(v(r,c[0])))}</td>`).join('')}${inTable?'':`<td class="hl">${esc(fv(sd[2](r)))}</td>`}</tr>`;
  }
  return s+'</tbody>';
}

const nextGame=t=>{const now=Date.now()-cfg().hours*3600e3;return D.sched.find(g=>(g[1]===t||g[2]===t)&&Date.parse(g[0])>now)};

// ---------------- defense vs position write-up
function tier(p){return p<.15?['Very favorable','var(--good)']:p<.35?['Favorable','color-mix(in oklab,var(--good) 70%,var(--mut))']:p<.65?['Neutral','var(--mut)']:p<.85?['Tough','color-mix(in oklab,var(--bad) 75%,var(--mut))']:['Very tough','var(--bad)']}
function dvpHtml(){
  const c=cfg(),b=P.b,dv=D.dvp&&D.dvp[b],o=D.teams[st.opp];
  if(!dv||!o)return `<p class="empty">No position matchup data for this player.</p>`;
  const N=D.teams.length,t=st.opp,ranks=dv.rank[t];
  if(!dv.n[t]||ranks.some(x=>x==null))return `<p class="empty">${esc(o.n)} haven't played yet this season.</p>`;
  const pos=c.posName[b],lgN=c.name;
  const sent=(i)=>{const rk=ranks[i],a=dv.avg[t][i],lg=dv.lg[i],lbl=c.dvpLbl[dv.k[i]]||dv.k[i];
    const place=rk<=N/2?`${rk===1?'the most':`the ${ord(rk)}-most`} in the ${lgN}`:`${rk===N?'the fewest':`the ${ord(N+1-rk)}-fewest`} in the ${lgN}`;
    const d=a-lg;return {rk,lbl,a,lg,place,d}};
  const rows=dv.k.map((_,i)=>sent(i));
  const p=mean(ranks.map(r=>(r-1)/(N-1)));const[tl,tc]=tier(p);
  const soft=rows.reduce((a,r)=>r.rk<a.rk?r:a),hard=rows.reduce((a,r)=>r.rk>a.rk?r:a);
  const nick=o.n.split(' ').slice(-1)[0];
  let para=`Across ${dv.n[t]} games this season, the ${esc(o.n)} have been a <b>${tl.toLowerCase()}</b> matchup for ${pos}. `;
  para+=soft.rk<=N/2?`Their weak spot is ${esc(soft.lbl)}: they allow ${f1(soft.a)} per game, ${soft.place}. `:`They're stingy across the board; even their softest area, ${esc(soft.lbl)}, ranks ${ord(soft.rk)} of ${N}. `;
  if(hard.rk>N/2&&hard!==soft)para+=`They're toughest on ${esc(hard.lbl)}, allowing ${f1(hard.a)}, ${hard.place}.`;
  return `<div class="verdict"><h3>How the ${esc(nick)} defend ${pos}</h3><span class="pill" style="background:${tc}">${tl}</span></div>
  <p>${para}</p>
  ${rows.map(r=>`<div class="dvrow"><div class="txt"><b>${f1(r.a)}</b> ${esc(r.lbl)} allowed per game to ${pos}<small>${ord(r.rk)} of ${N} · ${r.place} · league avg ${f1(r.lg)} (${r.d>=0?'+':''}${f1(r.d)})</small></div>
    <div><div class="track"><i style="left:${((N-r.rk)/(N-1)*100).toFixed(1)}%"></i></div><div class="ends"><span>Toughest</span><span>Softest</span></div></div></div>`).join('')}`;
}

// ---------------- player
function setPlayer(p){
  P=p;st.mark=null;$('mark').value='';
  const pc=posCfg();if(!pc.stats.some(s=>s[0]===st.stat))st.stat=pc.stats[0][0];
  save();
  const t=D.teams[p.t];document.documentElement.style.setProperty('--tc','#'+t.c);
  document.documentElement.style.setProperty('--tink',lum(t.c)>.45?'#111':'#fff');
  $('pname').textContent=p.n;
  $('pmeta').textContent=[t.n,...cfg().meta(p)].filter(Boolean).join(' · ');
  const ng=nextGame(p.t),nx=$('pnext');st.opp=null;
  if(ng){const home=ng[1]===p.t,o=D.teams[home?ng[2]:ng[1]],dt=new Date(ng[0]);
    nx.hidden=false;nx.innerHTML=`<span>Next</span><b>${home?'vs':'@'} ${esc(o.n)}</b><span>${esc(dt.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}))} · ${esc(dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))}</span>`;
    st.opp=home?ng[2]:ng[1]}else nx.hidden=true;
  const pg=played(p.g);if(st.opp==null&&pg.length)st.opp=pg[pg.length-1][2];
  let cs=played(p.g.filter(r=>D.games[r[0]][1]===curSeason())),lbl=cfg().seasonLbl(curSeason());
  if(!cs.length){cs=played(p.g.filter(r=>D.games[r[0]][1]===curSeason()-1));lbl=cfg().seasonLbl(curSeason()-1)}
  const statLbl=k=>{const s=pc.stats.find(x=>x[0]===k);return s?s[1]:k};
  $('tiles').innerHTML=pc.tiles.map(k=>{const s=pc.stats.find(x=>x[0]===k);const fn=s?s[2]:(r=>v(r,k));return `<div class="tile"><span class="big">${f1(mean(cs.map(fn)))}</span><small>${esc(k==='FPTS'?'Fantasy':statLbl(k).replace('Threes made','3PM'))}</small></div>`}).join('');
  $('tiles').title=`${lbl} averages, ${cs.length} games`;
  $('opp').innerHTML=D.teams.map((tm,i)=>i===p.t?'':`<option value="${i}">${esc(tm.n)}</option>`).join('');
  if(st.opp!=null)$('opp').value=st.opp;
  $('q').value='';render();
}

function render(){
  if(!P)return;
  const c=cfg(),pc=posCfg(),[k,label,fn]=statDef();
  setChips($('statGrp'),pc.stats.map(s=>[s[0],s[0]==='FPTS'?'Fantasy':s[0]]),'stat');
  setChips($('rangeGrp'),[...c.ranges,['season','This season'],['last',c.seasonLbl(curSeason()-1)],['all','All']],'range','Games');
  setChips($('locGrp'),[['all','All'],['home','Home'],['away','Away']],'loc','Where');
  const rows=rangeRows(),pr=played(rows),vals=pr.map(fn);
  const rl=st.range==='season'?'this season':st.range==='last'?c.seasonLbl(curSeason()-1):st.range==='all'?'all games since '+since():'last '+st.range+' games';
  $('recTitle').textContent=`${label}, ${rl}${st.loc==='home'?' at home':st.loc==='away'?' on the road':''}`;
  let sum=`<span><span class="big">${f1(mean(vals))}</span> avg</span><span>median ${f1(median(vals))}</span><span>high ${vals.length?esc(fv(Math.max(...vals))):'–'}</span><span>low ${vals.length?esc(fv(Math.min(...vals))):'–'}</span><span>${pr.length} games${rows.length>pr.length?` (+${rows.length-pr.length} DNP)`:''}</span>`;
  if(st.mark!=null&&vals.length){const h=vals.filter(x=>x>=st.mark).length;sum+=`<span class="hit">${h} of ${vals.length} at or above ${esc(st.mark)} (${Math.round(h/vals.length*100)}%)</span>`}
  $('recSum').innerHTML=sum;
  bars($('recSvg'),rows,false);
  $('recAvg').innerHTML=pr.length?pc.avgs(pr).map(([a,b])=>`<div><span class="big">${esc(b)}</span><small>${esc(a)}</small></div>`).join(''):'';
  $('recTbl').innerHTML=logTable(rows,false);
  // matchup
  const o=D.teams[st.opp],ng=nextGame(P.t),isNext=ng&&(ng[1]===st.opp||ng[2]===st.opp);
  $('vsTitle').textContent=o?`Matchup: ${o.n}`:'Matchup';
  $('vsSub').textContent=isNext?`Next opponent · ${new Date(ng[0]).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}`:'Pick any opponent to compare';
  $('dvp').innerHTML=dvpHtml();
  const vr=P.g.filter(r=>r[2]===st.opp),vp=played(vr),vv=vp.map(fn),all=played(P.g);
  $('histTitle').textContent=`His games against the ${o?o.n.split(' ').slice(-1)[0]:''}`;
  $('histSub').textContent=`${vp.length} game${vp.length===1?'':'s'} since ${since()}${vr.length>vp.length?`, ${vr.length-vp.length} missed`:''}`;
  const cmpKeys=[k,...pc.tiles.filter(x=>x!==k)].slice(0,5);
  $('vsCmp').innerHTML=vp.length?cmpKeys.map(kk=>{const s=pc.stats.find(x=>x[0]===kk),f=s?s[2]:(r=>v(r,kk)),a=mean(vp.map(f)),b=mean(all.map(f)),d=a-b;
    return `<div><span class="big">${f1(a)}</span><small>${esc(kk==='FPTS'?'Fantasy':kk)} vs them</small><small class="${d>=0?'up':'dn'}">${d>=0?'+':''}${f1(d)} vs his ${f1(b)} overall</small></div>`}).join('')+(st.mark!=null&&vv.length?`<div><span class="big" style="color:var(--acc)">${vv.filter(x=>x>=st.mark).length}/${vv.length}</span><small>${esc(k)} at or above ${esc(st.mark)}</small></div>`:''):'';
  $('vsFig').style.display=vp.length?'':'none';
  if(vp.length)bars($('vsSvg'),vr,true);
  $('vsTbl').innerHTML=vr.length?logTable(vr,true):`<tbody><tr><td class="empty">No games against the ${esc(o?o.n:'this team')} since ${esc(since())}.</td></tr></tbody>`;
}

// ---------------- search
let hits=[],hi=0;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.'’]/g,'');
function search(){
  const q=norm($('q').value.trim()),dd=$('dd');
  if(!q||!D){dd.classList.remove('on');return}
  hits=D.players.filter(p=>p._k.includes(q)).sort((a,b)=>(b._k.startsWith(q)-a._k.startsWith(q))||(b._m-a._m)).slice(0,12);hi=0;
  dd.innerHTML=hits.length?hits.map((p,i)=>`<button role="option" data-i="${i}" class="${i===0?'hl':''}"><span>${esc(p.n)}</span><small>${esc(D.teams[p.t].a)} · ${esc(p.p)}</small></button>`).join(''):'<div class="empty" style="padding:14px">No player found</div>';
  dd.classList.add('on');
}
$('q').addEventListener('input',search);
$('q').addEventListener('keydown',e=>{const bs=$('dd').querySelectorAll('button');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!bs.length)return;bs[hi]?.classList.remove('hl');hi=(hi+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[hi].classList.add('hl');bs[hi].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'&&hits[hi]){$('dd').classList.remove('on');setPlayer(hits[hi])}
  if(e.key==='Escape')$('dd').classList.remove('on')});
$('dd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('dd').classList.remove('on');setPlayer(hits[+b.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))$('dd').classList.remove('on')});
$('mark').addEventListener('input',e=>{const x=parseFloat(e.target.value);st.mark=Number.isFinite(x)?x:null;render()});
$('opp').addEventListener('change',e=>{st.opp=+e.target.value;render()});
$('lgGrp').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&b.dataset.v!==L)load(b.dataset.v)});

// ---------------- load a league
function load(lg){
  L=lg;for(const b of $('lgGrp').querySelectorAll('.chip'))b.setAttribute('aria-pressed',b.dataset.v===L);
  $('q').placeholder=`Search any ${cfg().name} player…`;$('thru').textContent='Loading…';
  const sv=saved[L]||{};st={stat:sv.stat||null,range:sv.range||cfg().defRange,loc:sv.loc||'all',mark:null,opp:null};
  const go=d=>{
    if(L!==lg)return;D=d;C={};d.cols.forEach((k,i)=>C[k]=i+7);
    $('thru').textContent=cfg().thru(d);
    $('foot').textContent=lg==='nba'?'NBA box scores from ESPN via the open hoopR dataset: regular season, play-in and playoffs from the last three seasons. Defense vs position uses this season only, grouped by guard, forward and center. Averages skip games the player didn’t play. Refreshed automatically every two hours. No odds or lines are shown.'
      :'NFL weekly player stats and schedule from the open nflverse data: regular season and playoffs from the last three seasons. Defense vs position uses this season only. Fantasy points are PPR. Refreshed automatically every two hours. No odds or lines are shown.';
    const pid=sv.pid;P=null;
    setPlayer(D.players.find(p=>p.id===pid)||D.players.find(p=>p.n===cfg().defPlayer)||D.players[0]);
  };
  if(cache[lg])return go(cache[lg]);
  fetch(cfg().file,{cache:'no-cache'}).then(r=>r.json()).then(d=>{
    const cs=d.season;
    for(const p of d.players){p._k=norm(p.n);p._m=p.g.reduce((a,r)=>a+(r.length>7&&d.games[r[0]][1]>=cs-1?(lg==='nba'?r[7]:r[r.length-1]+1):0),0)}
    cache[lg]=d;go(d);
  }).catch(()=>{if(L===lg){$('thru').textContent='Could not load stats.';$('pname').textContent='Data failed to load'}});
}
load(saved.league==='nfl'?'nfl':'nba');
}
</script>
